function secKeypad(action){
  var km=S.bk.keymap, cells=[], i;
  for(i=0;i<9;i++) cells.push('<button data-b="'+action+'" data-v="'+km[i]+'">'+km[i]+'</button>');
  cells.push('<button class="sm" data-b="pinclr">전체삭제</button>');
  cells.push('<button data-b="'+action+'" data-v="'+km[9]+'">'+km[9]+'</button>');
  cells.push('<button class="sm" data-b="pindel">←</button>');
  return '<div class="seckey"><div class="seclab">보안키패드 · 숫자 위치가 매번 바뀝니다</div>'
    +'<div class="bkeys">'+cells.join("")+'</div></div>';
}
function numKeypad(action){
  var cells=[1,2,3,4,5,6,7,8,9].map(function(n){return '<button data-b="'+action+'" data-v="'+n+'">'+n+'</button>';});
  cells.push('<button class="sm" data-b="'+action+'" data-v="00">00</button>');
  cells.push('<button data-b="'+action+'" data-v="0">0</button>');
  cells.push('<button class="sm" data-b="'+action+'del">←</button>');
  return '<div class="bkeys">'+cells.join("")+'</div>';
}
function dots(n,len){
  var h="",i; for(i=0;i<(len||6);i++) h+='<i class="'+(i<n?"f":"")+'"></i>';
  return '<div class="bdots">'+h+'</div>';
}

/* 지도는 위치 허용 전에도 표시합니다. Client Secret과 위치 좌표는 저장하지 않습니다. */
var NAVER_MAP_CLIENT_ID="gl61r2i8ba";
var mapInstance=null, mapMountToken=0, naverMapPromise=null, naverMapFailed=false;
function clearMap(){
  mapMountToken++;
  if(!mapInstance) return;
  if(mapInstance.kind==="naver"){
    if(mapInstance.infoWindow) mapInstance.infoWindow.close();
    if(mapInstance.marker) mapInstance.marker.setMap(null);
    (mapInstance.places||[]).forEach(function(marker){
      naver.maps.Event.clearInstanceListeners(marker);
      marker.setMap(null);
    });
    mapInstance.map.destroy();
  }else mapInstance.map.remove();
  mapInstance=null;
}
function visibleMapItems(){
  return S.map.items.filter(function(x){return S.map.category==="all" || x.category===S.map.category;});
}
function mapMarkerInfo(x){
  return '<div class="map-marker-info"><strong>'+esc(x.name)+'</strong><small>'
    +(x.category==="bank"?"은행":"식당")+'</small></div>';
}
function syncMapMarkers(){
  if(!mapInstance) return;
  var holder=mapInstance;
  if(holder.kind==="naver"){
    holder.selectedPlace=null;
    holder.infoWindow.close();
  }
  (holder.places||[]).forEach(function(marker){
    if(holder.kind==="naver"){
      naver.maps.Event.clearInstanceListeners(marker);
      marker.setMap(null);
    }
    else holder.map.removeLayer(marker);
  });
  holder.places=[];
  visibleMapItems().forEach(function(x){
    if(x.lat==null || x.lon==null) return;
    var marker;
    if(holder.kind==="naver"){
      marker=new naver.maps.Marker({
        position:new naver.maps.LatLng(x.lat,x.lon),map:holder.map,
        title:(x.category==="bank"?"은행 · ":"식당 · ")+x.name,
        icon:{content:'<span class="map-pin '+x.category+'">'+(x.category==="bank"?"은":"식")+'</span>',
          size:new naver.maps.Size(36,36),anchor:new naver.maps.Point(18,18)}
      });
      var info=mapMarkerInfo(x);
      function showInfo(){
        holder.infoWindow.setContent(info);
        holder.infoWindow.open(holder.map,marker);
      }
      naver.maps.Event.addListener(marker,"mouseover",showInfo);
      naver.maps.Event.addListener(marker,"mouseout",function(){
        if(holder.selectedPlace && holder.selectedPlace.marker!==marker){
          holder.infoWindow.setContent(holder.selectedPlace.info);
          holder.infoWindow.open(holder.map,holder.selectedPlace.marker);
        }else if(!holder.selectedPlace) holder.infoWindow.close();
      });
      naver.maps.Event.addListener(marker,"click",function(){
        holder.selectedPlace={marker:marker,info:info};
        showInfo();
      });
    }else{
      marker=L.circleMarker([x.lat,x.lon],{radius:9,color:x.category==="bank"?'#164F9A':'#A94C00',
        weight:3,fillOpacity:.85}).addTo(holder.map);
      marker.bindTooltip(esc(x.name),{direction:"top",offset:[0,-9]});
      marker.bindPopup(mapMarkerInfo(x));
    }
    holder.places.push(marker);
  });
}
function loadNaverMap(){
  if(naverMapFailed) return Promise.reject(new Error("naver map unavailable"));
  if(window.naver && naver.maps && naver.maps.Map) return Promise.resolve();
  if(!naverMapPromise){
    naverMapPromise=new Promise(function(resolve,reject){
      var script=document.createElement("script");
      var timeout=setTimeout(function(){
        naverMapFailed=true;
        reject(new Error("naver map timed out"));
      },12000);
      script.src="https://oapi.map.naver.com/openapi/v3/maps.js?ncpKeyId="+encodeURIComponent(NAVER_MAP_CLIENT_ID);
      script.onload=function(){
        clearTimeout(timeout);
        if(!naverMapFailed && window.naver && naver.maps && naver.maps.Map) resolve();
        else reject(new Error("naver map unavailable"));
      };
      script.onerror=function(){ clearTimeout(timeout); reject(new Error("naver map load failed")); };
      document.head.appendChild(script);
    }).catch(function(err){ naverMapFailed=true; throw err; });
  }
  return naverMapPromise;
}
window.navermap_authFailure=function(){
  naverMapFailed=true;
  if(S.mode==="lobby" && S.lv==="map"){
    clearMap();
    var node=document.getElementById("mapCanvas");
    if(node) mountFallbackMap(node);
  }else if(S.mode==="taxi"){
    var taxiNode=document.getElementById("taxiMap");
    clearTaxiMap();
    if(taxiNode) mountTaxiFallback(taxiNode);
  }
};
function mountFallbackMap(node){
  var note=document.getElementById("mapMessage");
  if(note) note.textContent=location.protocol==="file:"
    ?"파일 미리보기에서는 네이버 지도 인증이 제한될 수 있어 기본 지도를 표시합니다. 공개 HTTPS 주소에서 네이버 지도를 확인해 주세요."
    :"네이버 지도 인증 또는 연결에 실패해 기본 지도를 표시합니다. 네이버 클라우드의 Web 서비스 URL을 확인해 주세요.";
  if(!window.L){ node.textContent="지도를 불러오지 못했습니다. 인터넷 연결을 확인해 주세요."; return; }
  var m=S.map, located=m.lat!=null && m.lon!=null;
  var map=L.map(node,{scrollWheelZoom:false}).setView(located?[m.lat,m.lon]:[36.35,127.8],located?16:7);
  var failedTiles=0;
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{
    maxZoom:19, attribution:'&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener noreferrer">OpenStreetMap 기여자</a>'
  }).on("tileerror",function(){
    failedTiles++;
    if(failedTiles>=3 && note) note.textContent="지도 이미지를 불러오지 못했습니다. 인터넷 연결을 확인하고 공개 HTTPS 주소에서 다시 열어 주세요.";
  }).addTo(map);
  if(located) L.circleMarker([m.lat,m.lon],{radius:10,color:'#124B9B',weight:3,fillColor:'#fff',fillOpacity:1})
    .addTo(map).bindPopup('내 위치');
  mapInstance={kind:"leaflet",map:map,places:[]};
  syncMapMarkers();
}
function mountMap(){
  var node=document.getElementById("mapCanvas");
  if(!node) return;
  if(location.protocol==="file:"){ mountFallbackMap(node); return; }
  var token=mapMountToken;
  loadNaverMap().then(function(){
    if(token!==mapMountToken || !node.isConnected || naverMapFailed) return;
    var m=S.map, located=m.lat!=null && m.lon!=null;
    var map=new naver.maps.Map(node,{
      center:new naver.maps.LatLng(located?m.lat:36.35,located?m.lon:127.8),
      zoom:located?16:7, zoomControl:true, gl:false
    });
    if(token!==mapMountToken || naverMapFailed){ map.destroy(); return; }
    var marker=located?new naver.maps.Marker({position:new naver.maps.LatLng(m.lat,m.lon),map:map,title:"내 위치"}):null;
    var infoWindow=new naver.maps.InfoWindow({content:"",maxWidth:240,disableAutoPan:true});
    mapInstance={kind:"naver",map:map,marker:marker,places:[],infoWindow:infoWindow,selectedPlace:null};
    naver.maps.Event.addListener(map,"click",function(){
      if(mapInstance && mapInstance.map===map){
        mapInstance.selectedPlace=null;
        infoWindow.close();
      }
    });

function findNearby(){
  if(!navigator.geolocation){ S.map.error="이 기기에서는 위치 기능을 사용할 수 없습니다."; render(); return; }
  S.map.status="loading"; S.map.error=""; S.map.items=[]; render();
  navigator.geolocation.getCurrentPosition(function(pos){
    var lat=+pos.coords.latitude.toFixed(5), lon=+pos.coords.longitude.toFixed(5);
    S.map.lat=lat; S.map.lon=lon; render();
    var q='[out:json][timeout:20];nwr["amenity"~"^(restaurant|fast_food|bank)$"](around:1000,'+lat+','+lon+');out center;';
    fetch('https://overpass-api.de/api/interpreter',{method:'POST',body:'data='+encodeURIComponent(q),
      headers:{'Content-Type':'application/x-www-form-urlencoded'}})
      .then(function(r){ if(!r.ok) throw new Error('map'); return r.json(); })
      .then(function(data){
        var near=(data.elements||[]).filter(function(x){
          return x.tags && x.tags.name && ["restaurant","fast_food","bank"].indexOf(x.tags.amenity)>-1;
        }).map(function(x){
          var point=x.center||x;
          return {type:x.type,id:x.id,name:x.tags['name:ko']||x.tags.name,
            category:x.tags.amenity==="bank"?"bank":"restaurant",lat:point.lat,lon:point.lon};
        }).filter(function(x){return Number.isFinite(x.lat) && Number.isFinite(x.lon);});
        var cos=Math.cos(lat*Math.PI/180);
        near.sort(function(a,b){
          var da=(a.lat-lat)**2+((a.lon-lon)*cos)**2, db=(b.lat-lat)**2+((b.lon-lon)*cos)**2;
          return da-db;
        });
        var counts={restaurant:0,bank:0};
        S.map.items=near.filter(function(x){
          if(counts[x.category]>=25) return false;
          counts[x.category]++;
          return true;
        });
        S.map.status="ready"; if(S.mode==="lobby"&&S.lv==="map") render();
      }).catch(function(){S.map.status="error";S.map.error="주변 장소 목록을 가져오지 못했습니다. 잠시 후 다시 눌러 주세요.";
        if(S.mode==="lobby"&&S.lv==="map") render();});
  },function(err){ S.map.status="error";
    S.map.error=err.code===1?"위치 권한이 꺼져 있습니다. 브라우저 설정에서 허용해 주세요.":"현재 위치를 확인하지 못했습니다. 다시 눌러 주세요.";
    if(S.mode==="lobby"&&S.lv==="map") render();
  },{enableHighAccuracy:false,timeout:10000,maximumAge:300000});
}

  if(taxiMap){
    if(taxiMapKind==="naver"){
      taxiOverlays.forEach(function(overlay){ overlay.setMap(null); });
      taxiMap.destroy();
    }else taxiMap.remove();
  }
  taxiMap=null; taxiMapKind=null; taxiCarMarker=null; taxiOverlays=[]; taxiPracticeLayer=null;
}
function stopTaxiTimer(){ if(taxiTimer){ clearInterval(taxiTimer); taxiTimer=null; } }
function taxiDistance(a,b){
  var rad=Math.PI/180, dlat=(b.lat-a.lat)*rad, dlon=(b.lon-a.lon)*rad;
  var q=Math.sin(dlat/2)**2+Math.cos(a.lat*rad)*Math.cos(b.lat*rad)*Math.sin(dlon/2)**2;
  return 6371*2*Math.atan2(Math.sqrt(q),Math.sqrt(1-q));
}
function taxiFare(){
  var tx=S.tx, km=taxiDistance(tx.pickup,tx.destination);
  return Math.round((Math.max(4800,4800+km*1200)+(tx.vehicle==="wide"?2500:0))/100)*100;
}
function taxiCoord(p){ return p.lat.toFixed(5)+", "+p.lon.toFixed(5); }

}

function taxiCarPoint(progress){
  var p=S.tx.pickup, f=1-progress/100;
  return [p.lat+0.004*f,p.lon-0.004*f];
}
function taxiMapStatus(message){
  var note=document.getElementById("taxiMapProvider");
  if(note) note.textContent=message;
}
function taxiMapNotice(message,practice){
  var note=document.getElementById("taxiMapNotice");
  if(note){ note.textContent=message||""; note.hidden=!message; note.classList.toggle("practice",!!practice); }
}
function drawTaxiPracticeMap(map){
  if(!window.L) return;
  if(taxiPracticeLayer) map.removeLayer(taxiPracticeLayer);
  var c=map.getCenter(), d=.00035*Math.pow(2,17-map.getZoom()), lat=c.lat, lon=c.lng;
  var group=L.layerGroup().addTo(map);
  for(var i=-8;i<=8;i++){
    L.polyline([[lat+i*d,lon-9*d],[lat+i*d,lon+9*d]],{color:i%4===0?"#F5F4ED":"#F9FAF7",weight:i%4===0?15:9,interactive:false}).addTo(group);
    L.polyline([[lat-9*d,lon+i*d],[lat+9*d,lon+i*d]],{color:i%4===0?"#F5F4ED":"#F9FAF7",weight:i%4===0?15:9,interactive:false}).addTo(group);
  }
  for(var y=-6;y<=6;y+=2) for(var x=-6;x<=6;x+=2){
    var green=(x===4&&y===2)||(x===-4&&y===-4);
    L.rectangle([[lat+(y+.3)*d,lon+(x+.3)*d],[lat+(y+1.65)*d,lon+(x+1.65)*d]],{
      color:green?"#C8DDBF":"#CED9DC",weight:1,fillColor:green?"#D7E9CB":"#F7F9F7",fillOpacity:1,interactive:false
    }).addTo(group);
  }
  [[1,1,"연습용 건물"],[-3,2,"정류장"],[3,-4,"도서관"]].forEach(function(p){
    L.marker([lat+p[0]*d,lon+p[1]*d],{interactive:false,
      icon:L.divIcon({className:"",html:'<span class="taxi-practice-label">'+p[2]+'</span>',iconSize:[0,0]})}).addTo(group);
  });
  taxiPracticeLayer=group;
}
function taxiNaverPoint(p){ return new naver.maps.LatLng(p.lat,p.lon); }
function taxiNaverMarker(map,p,label,color){
  return new naver.maps.Marker({position:taxiNaverPoint(p),map:map,title:label,
    icon:{content:'<span class="taxi-map-marker" style="background:'+color+';color:'+(color==="#3177EA"?"#fff":"#20304E")+'">'+label+'</span>',
      size:new naver.maps.Size(40,40),anchor:new naver.maps.Point(20,20)}});
}
function mountTaxiNaver(node){
  var tx=S.tx, choosing=tx.step==="pickup"||tx.step==="destination";
  var center=choosing?tx.center:tx.pickup;
  var map=new naver.maps.Map(node,{center:taxiNaverPoint(center),zoom:choosing?(tx.zoom||17):14,
    zoomControl:true,scrollWheel:false,gl:false});
  taxiMap=map; taxiMapKind="naver"; taxiMapStatus("네이버 지도를 사용 중입니다.");
  if(choosing){
    naver.maps.Event.addListener(map,"idle",function(){
      if(taxiMap!==map || S.tx!==tx) return;
      var p=map.getCenter(); tx.center={lat:p.lat(),lon:p.lng()}; tx.zoom=map.getZoom();
      var label=document.getElementById("taxiCoord"); if(label) label.textContent=taxiCoord(tx.center);
    });
    naver.maps.Event.addListener(map,"click",function(e){ map.panTo(e.coord); });
  }else{
    var pickup=taxiNaverMarker(map,tx.pickup,"탈 곳","#FFD15A");
    var destination=taxiNaverMarker(map,tx.destination,"갈 곳","#3177EA");
    var line=new naver.maps.Polyline({map:map,path:[taxiNaverPoint(tx.pickup),taxiNaverPoint(tx.destination)],
      strokeColor:"#3177EA",strokeWeight:5,strokeOpacity:.85});
    taxiOverlays.push(pickup,destination,line);
    if(tx.step==="dispatch"||tx.step==="arrived"){
      var car=taxiCarPoint(tx.step==="arrived"?100:tx.progress);
      taxiCarMarker=taxiNaverMarker(map,{lat:car[0],lon:car[1]},"🚕","#FFD15A");
      taxiOverlays.push(taxiCarMarker);
      var start=taxiCarPoint(0);
      map.fitBounds(naver.maps.LatLngBounds.bounds(new naver.maps.LatLng(start[0],start[1]),taxiNaverPoint(tx.pickup)));
    }else map.fitBounds(naver.maps.LatLngBounds.bounds(taxiNaverPoint(tx.pickup),taxiNaverPoint(tx.destination)));
    if(map.getZoom()>16) map.setZoom(16);
  }
}
function mountTaxiFallback(node){
  if(!window.L){
    taxiMapStatus("지도를 불러오지 못했습니다.");
    taxiMapNotice("지도 라이브러리를 열 수 없습니다. 인터넷 연결을 확인하고, 공개 HTTPS 주소에서 다시 열어 주세요.");
    return;
  }
  var tx=S.tx, choosing=tx.step==="pickup"||tx.step==="destination";
  var center=choosing?tx.center:tx.pickup;
  taxiMap=L.map(node,{zoomControl:false,scrollWheelZoom:false}).setView([center.lat,center.lon],choosing?(tx.zoom||17):14);
  taxiMapKind="leaflet";
  taxiMapStatus(location.protocol==="file:"
    ?"파일 미리보기에서는 기본 지도를 표시합니다. 네이버 지도는 공개 HTTPS 주소에서 확인해 주세요."
    :"네이버 지도 연결에 실패해 기본 지도를 표시합니다.");
  node.classList.add("practice-map");
  drawTaxiPracticeMap(taxiMap);
  taxiMapNotice("연습용 지도 · 실제 지도 연결 중",true);
  var failedTiles=0;
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,
    attribution:'&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener noreferrer">OpenStreetMap 기여자</a>'})
    .on("tileerror",function(){
      failedTiles++;
      if(failedTiles>=3) taxiMapNotice("연습용 지도 · 실제 지도는 HTTPS 주소에서 확인",true);
    }).on("load",function(){
      if(failedTiles===0 && taxiMap && taxiMapKind==="leaflet"){
        if(taxiPracticeLayer){ taxiMap.removeLayer(taxiPracticeLayer); taxiPracticeLayer=null; }
        node.classList.remove("practice-map"); taxiMapNotice("");
      }
    }).addTo(taxiMap);
  L.control.zoom({position:"bottomleft"}).addTo(taxiMap);
  if(choosing){
    taxiMap.on("moveend",function(){
      if(S.tx!==tx) return;
      var p=taxiMap.getCenter(); tx.center={lat:p.lat,lon:p.lng}; tx.zoom=taxiMap.getZoom();
      var label=document.getElementById("taxiCoord"); if(label) label.textContent=taxiCoord(tx.center);
      if(taxiPracticeLayer) drawTaxiPracticeMap(taxiMap);
    });
    taxiMap.on("click",function(e){ taxiMap.panTo(e.latlng); });
  }else{
    L.circleMarker([tx.pickup.lat,tx.pickup.lon],{radius:10,color:"#233345",fillColor:"#FFD15A",fillOpacity:1,weight:3}).addTo(taxiMap).bindTooltip("탈 곳");
    L.circleMarker([tx.destination.lat,tx.destination.lon],{radius:10,color:"#fff",fillColor:"#2563D9",fillOpacity:1,weight:3}).addTo(taxiMap).bindTooltip("갈 곳");
    L.polyline([[tx.pickup.lat,tx.pickup.lon],[tx.destination.lat,tx.destination.lon]],{color:"#3177EA",weight:5,dashArray:"8 6"}).addTo(taxiMap);
    if(tx.step==="dispatch"||tx.step==="arrived"){
      taxiCarMarker=L.marker(taxiCarPoint(tx.step==="arrived"?100:tx.progress),{
        icon:L.divIcon({className:"",html:'<span class="taxi-car">🚕</span>',iconSize:[38,38],iconAnchor:[19,19]})
      }).addTo(taxiMap);
      taxiMap.fitBounds([taxiCarPoint(0),[tx.pickup.lat,tx.pickup.lon]],{padding:[55,55],maxZoom:16});
    }else taxiMap.fitBounds([[tx.pickup.lat,tx.pickup.lon],[tx.destination.lat,tx.destination.lon]],{padding:[35,35],maxZoom:16});
  }
  setTimeout(function(){ if(taxiMap && node.isConnected) taxiMap.invalidateSize(); },80);
}
function mountTaxiMap(){
  var node=document.getElementById("taxiMap"); if(!node) return;
  if(location.protocol==="file:"){ mountTaxiFallback(node); return; }
  var token=taxiMountToken;
  loadNaverMap().then(function(){
    if(token!==taxiMountToken || !node.isConnected || naverMapFailed) return;
    try{ mountTaxiNaver(node); }
    catch(e){
      clearTaxiMap();
      if(node.isConnected) mountTaxiFallback(node);
    }
  }).catch(function(){
    if(token===taxiMountToken && node.isConnected) mountTaxiFallback(node);
  });
}
function taxiLocate(){
  var tx=S.tx;
  if(tx.locating) return;
  if(!navigator.geolocation){ tx.gpsStatus="이 기기에서는 위치를 찾을 수 없습니다. 지도를 움직여 정해 주세요."; render(); return; }
  tx.locating=true; tx.gpsStatus="현재 위치를 확인하고 있습니다."; render();
  navigator.geolocation.getCurrentPosition(function(pos){
    if(S.mode!=="taxi"||S.tx!==tx||tx.step!=="pickup") return;
    tx.locating=false; tx.gpsUsed=true;
    tx.center={lat:pos.coords.latitude,lon:pos.coords.longitude}; tx.zoom=18;
    tx.gpsStatus="현재 위치를 찾았습니다. 지도에서 택시 아이콘을 움직여 탑승 지점을 세밀하게 맞춰 주세요.";
    render();
  },function(){
    if(S.mode!=="taxi"||S.tx!==tx||tx.step!=="pickup") return;
    tx.locating=false; tx.gpsStatus="위치를 확인하지 못했습니다. 지도를 움직여 탑승 지점을 직접 정해 주세요.";
    render();
  },{enableHighAccuracy:true,timeout:12000,maximumAge:0});
}
function taxiAct(btn){
  var tx=S.tx, a=btn.getAttribute("data-x"), v=btn.getAttribute("data-v");
  if(a==="start"){ tx.step="pickup"; render(); return; }
  if(a==="mapBack"){
    if(tx.step==="pickup") tx.step="home";
    else if(tx.step==="destination") tx.step="pickup";
    else if(tx.step==="vehicle") tx.step="destination";
    else if(tx.step==="payment") tx.step="vehicle";
    else tx.step="home";
    render(); return;
  }
  if(a==="quick"){
    tx.destinationName=v;
    tx.pickup={lat:tx.center.lat,lon:tx.center.lon,label:tx.pickupName.trim()||"지도에서 지정한 탑승 지점"};
    tx.step="destination"; tx.zoom=16; render();
    toast(v+" 위치를 지도에서 지정해 주세요."); return;
  }
  if(a==="locate"){ taxiLocate(); return; }
  if(a==="pickup"){
    tx.pickup={lat:tx.center.lat,lon:tx.center.lon,label:tx.pickupName.trim()||"지도에서 지정한 탑승 지점"};
    tx.step="destination"; tx.zoom=16;
  }else if(a==="destination"){
    if(taxiDistance(tx.pickup,tx.center)<0.08){ toast("갈 곳을 탈 곳에서 조금 떨어진 위치로 옮겨 주세요."); return; }
    tx.destination={lat:tx.center.lat,lon:tx.center.lon,label:tx.destinationName.trim()||"지도에서 지정한 목적지"};
    tx.step="vehicle";
  }else if(a==="vehicle") tx.vehicle=v;
  else if(a==="payment") tx.payment=v;
  else if(a==="nextPayment") tx.step="payment";
  else if(a==="pay"){ tx.progress=0; tx.arrived=false; tx.step="dispatch"; }
  else if(a==="backPickup"){ tx.step="pickup"; tx.center={lat:tx.pickup.lat,lon:tx.pickup.lon}; tx.zoom=17; }
  else if(a==="backDestination"){ tx.step="destination"; tx.center={lat:tx.destination.lat,lon:tx.destination.lon}; tx.zoom=16; }
  else if(a==="backVehicle") tx.step="vehicle";
  else if(a==="restart"){ softReset(); }
  render();
}
function startTaxiTimer(){
  if(taxiTimer) return;
  taxiTimer=setInterval(function(){
    if(S.mode!=="taxi"||S.tx.step!=="dispatch"){stopTaxiTimer();return;}
    S.tx.progress=Math.min(100,S.tx.progress+5);
    if(taxiCarMarker){
      var car=taxiCarPoint(S.tx.progress);
      if(taxiMapKind==="naver") taxiCarMarker.setPosition(new naver.maps.LatLng(car[0],car[1]));
      else taxiCarMarker.setLatLng(car);
    }
    var bar=document.getElementById("taxiProgress"); if(bar) bar.style.width=S.tx.progress+"%";
    var time=document.getElementById("taxiEta"); if(time) time.textContent="도착까지 약 "+Math.max(1,Math.ceil((100-S.tx.progress)/25))+"분";
    if(S.tx.progress>=100){
      stopTaxiTimer(); S.tx.arrived=true; S.tx.step="arrived";
      S.tx.missionPassed=!!finishCheck(); if(!S.tx.missionPassed) logFail();
      render();
    }
  },900);
}

function tableAct(btn){
  var a=btn.getAttribute("data-o"), v=btn.getAttribute("data-v"), t=S.tb;
  if(a==="cat"){ t.cat=+v; }
  else if(a==="pick"){ t.modal=v; t.qty=1; }
  else if(a==="q+"){ t.qty=Math.min(20,t.qty+1); }
  else if(a==="q-"){ t.qty=Math.max(1,t.qty-1); }
  else if(a==="close"){ t.modal=null; }
  else if(a==="add"){
    var hit=t.cart.filter(function(x){return x.id===t.modal;})[0];
    if(hit) hit.q+=t.qty; else t.cart.push({id:t.modal,q:t.qty});
    t.modal=null;
  }
  else if(a==="del"){ t.cart.splice(+v,1); t.removed=true; if(S.mission===4) finishCheck(); }
  else if(a==="order"){
    if(!t.cart.length) return;
    t.rounds++;
    t.cart.forEach(function(x){ t.ordered.push({id:x.id,q:x.q,round:t.rounds}); });
    t.cart=[]; t.step="sent"; finishCheck();
  }
  else if(a==="orders"){ t.viewedOrders=true; t.step="orders"; if(S.mission===3) finishCheck(); }
  else if(a==="menu"){ t.step="menu"; }
  else if(a==="call"){ t.step="call"; }
  else if(a==="docall"){ t.called=v; t.step="called"; finishCheck(); }
  else if(a==="payreq"){ t.payReq=true; t.step="payreq"; finishCheck(); }
  render();
}

  var p=S.tr.pax;
  HINT='[data-t="paxok"]';
  function row(key,nm,sub){
    return '<div class="tpaxrow"><span class="lb"><b>'+nm+'</b><small>'+sub+'</small></span>'
      +'<span class="tstep"><button data-t="pax-" data-v="'+key+'" '+(p[key]<=0?'disabled':'')+'>−</button>'
      +'<span>'+p[key]+'</span><button data-t="pax+" data-v="'+key+'">+</button></span></div>';
  }
  return tShell(
    '<div class="bk"><h2>몇 분이 타세요?</h2>'
      +'<div class="bpanel" style="padding:calc(var(--u)*4) calc(var(--u)*15)">'
        +row("adult","어른","만 13세 ~ 64세")
        +row("senior","경로","만 65세 이상 · 30% 할인")
        +row("child","어린이","만 6세 ~ 12세 · 50% 할인")
      +'</div>'
      +(hasSenior()
        ?'<div class="bcard"><div class="bconf"><span>경로 할인</span><span style="color:var(--brand)">1인 59,800원 → 41,800원</span></div></div>'
        :'<div class="bwarn">만 65세가 넘으시면 <b>경로</b>로 고르셔야 30% 쌉니다. 어른으로 두면 할인이 안 됩니다.</div>')
      +'<p class="lead">경로 할인은 신분증을 지참하셔야 합니다. 역에서 확인할 수 있습니다.</p>'
      +'<button class="bfill" data-t="paxok">'+paxCount()+'명으로 하기</button>'
    +'</div>', {title:"인원 선택", back:"tab-home", tab:"home"});
}
function vtCls(){

  return tShell(

        +'<span class="bt"><b>일반 좌석</b><small>서울 → 부산 59,800원</small></span></button>'

/* ── 열차 조회 결과 ── */
function vtList(){
  var t=S.tr, ds=trDates(), d=ds[t.dateIdx];
  var list=RAIL.trains.filter(function(x){ return parseInt(x.dep,10)>=t.hour; });
  HINT='.trow:not(.out)';
  var head='<div class="tlhead">'
    +'<div class="tlh1"><button class="bk" data-t="tab-home" aria-label="이전">'+TI('back')+'</button>'
      +'<span class="rt"><b>'+t.from+' '+TI('arrow')+' '+t.to+'</b>'
      +'<small>인원 '+paxCount()+'명 · '+t.cls+' 좌석</small></span>'
      +'<button class="edit" data-t="tab-home">수정</button>'
      +'<button class="thico" data-t="nope" aria-label="새로고침">'+TI('refresh')+'</button></div>'
    +'<div class="tdatebar">'
      +'<button class="nav" data-t="dprev" '+(t.dateIdx<=0?'disabled':'')+' aria-label="앞날">'+TI('back')+'</button>'
      +'<span class="lbl">'+d.label+' '+(t.hour<10?"0":"")+t.hour+':00시 이후</span>'
      +'<button class="nav" data-t="dnext" '+(t.dateIdx>=6?'disabled':'')+' aria-label="다음날">'+TI('next')+'</button></div>'
    +'<div class="tfilters">'
      +'<button data-t="nope">전체 열차'+TI('down')+'</button>'
      +'<button data-t="nope">직통'+TI('down')+'</button>'
      +'<button data-t="go-cls">'+t.cls+' 좌석'+TI('down')+'</button></div>'
  +'</div>'
  +'<div class="tsortrow"><span class="s">'+TI('sort')+'출발 빠른 순</span>'
    +'<span class="k">일반실 운임 | 특실 운임+요금</span></div>';

  var rows = list.length ? list.map(function(x){
    var i=RAIL.trains.indexOf(x);
    function cell(cls,sold,fare){
      var sel=(t.cls===cls);
      if(sold) return '<span class="cl'+(sel?' sel':'')+'"><span class="nm">'+cls+'실</span><span class="vl sold">매진</span></span>';
      var p=t.pax, full=fare*p.adult+Math.floor(fare*0.7/100)*100*p.senior+Math.floor(fare*0.5/100)*100*p.child;
      var base=fare*paxCount();
      return '<span class="cl'+(sel?' sel':'')+'"><span class="nm">'+cls+'실</span>'
        +'<span class="vl ok">'+(full<base?'<span class="was">'+base.toLocaleString("ko-KR")+'</span>':'')
        +full.toLocaleString("ko-KR")+'원</span></span>';
    }
    return '<button class="trow'+(soldOut(x)?' out':'')+'" data-t="'+(soldOut(x)?'nope':'pick-train')+'" data-v="'+i+'">'
      +'<span class="tt"><span class="kind'+(x.kind==="일반"?" slow":"")+'">'+x.kind+'</span>'
        +'<span class="no">'+x.no+' · 중간정차역 '+x.stops+'개</span></span>'
      +'<span class="body"><span class="left">'
        +'<span class="tline"><span class="tx"><b>'+x.dep+'</b><small>'+t.from+'</small></span>'
          +'<span class="ar">'+TI('arrow')+'</span>'
          +'<span class="tx"><b>'+x.arr+'</b><small>'+t.to+'</small></span></span>'
        +'<span class="durchip">'+x.dur+' 소요</span></span>'
      +'<span class="cls">'+cell("일반",x.sold,x.fare)+cell("특",x.sold2,x.fare2)+'</span></span>'
    +'</button>';
  }).join("") : '';

  var more='<div class="tmore"><p>원하는 열차를 찾지 못하셨나요?</p>'
    +'<button data-t="dnext" '+(t.dateIdx>=6?'disabled style="opacity:.4"':'')+'>다음날('+ds[Math.min(t.dateIdx+1,6)].short+') 열차 찾아보기 ›</button></div>';

  return tShell(rows+(list.length?'':'<p class="lead" style="padding:calc(var(--u)*18)">그 시간 뒤에 가는 열차가 없습니다.</p>')+more,
    {raw:head, nobody:true, tab:"home"});
}

/* ── 좌석 ── */
function vtSeatMode(){
  HINT = (S.mission===3) ? '[data-t="seatmode"][data-v="pick"]' : '[data-t="seatmode"][data-v="auto"]';
  return tShell(
    '<div class="bk"><h2>좌석을 어떻게 할까요?</h2>'
      +'<button class="brow" data-t="seatmode" data-v="auto"><span class="bi">'+TI('seat')+'</span>'
        +'<span class="bt"><b>자동으로 배정받기</b><small>빠릅니다. 자리는 고를 수 없습니다</small></span></button>'
      +'<button class="brow" data-t="seatmode" data-v="pick"><span class="bi">'+TI('seat')+'</span>'
        +'<span class="bt"><b>내가 직접 고르기</b><small>창가·통로를 고를 수 있습니다</small></span></button>'
      +'<p class="lead">창밖을 보고 싶으시면 <b>직접 고르기</b>에서 창가(A·D)를 누르세요.</p>'
    +'</div>', {title:"좌석 선택", back:"back-list", tab:"home"});
}
function vtSeat(){
  var t=S.tr, rows=[], i;
  HINT='.tseat.win:not(.taken)';
  for(i=1;i<=10;i++){
    rows.push('<div class="tseatrow">'+["A","B"].map(function(c){return seatBtn(i,c);}).join("")
      +'<span class="taisle">'+i+'</span>'+["C","D"].map(function(c){return seatBtn(i,c);}).join("")+'</div>');
  }
  return tShell(
    '<div class="bk">'
      +'<div class="tcar"><b>'+t.car+'호차 · '+t.cls+'실</b><span class="lead" style="margin:0">앞쪽 ↑ 진행 방향</span></div>'
      +'<div class="tseatmap">'
        +'<div class="tseathdr"><span>A<br>창가</span><span>B</span><span></span><span>C</span><span>D<br>창가</span></div>'
        +rows.join("")
        +'<div class="tlegend"><span><i class="w"></i>창가</span><span><i></i>통로쪽</span>'
        +'<span><i class="t"></i>이미 팔림</span><span><i class="s"></i>내가 고른 자리</span></div>'
      +'</div>'
      +(t.seat?'<div class="bcard"><div class="bconf"><span>고른 자리</span><span>'+t.car+'호차 '+t.seat
        +' ('+(/[AD]$/.test(t.seat)?"창가":"통로쪽")+')</span></div></div>':'<p class="lead">자리를 하나 누르세요.</p>')
      +'<button class="bfill" data-t="seatok" '+(t.seat?'':'style="opacity:.45"')+'>이 자리로 하기</button>'
    +'</div>', {title:"좌석 고르기", back:"back-seatmode", tab:"home"});
}
function seatBtn(r,c){
  var id=r+c, t=S.tr, taken=RAIL.taken.indexOf(id)>-1, win=(c==="A"||c==="D");
  return '<button class="tseat'+(win?" win":"")+(taken?" taken":"")+'" '
    +(taken?'data-t="nope"':'data-t="seat" data-v="'+id+'"')
    +' aria-pressed="'+(t.seat===id)+'">'+id+'</button>';
}

/* ========== 기차 예매 이벤트 ========== */
function trainAct(btn){
  var a=btn.getAttribute("data-t"), v=btn.getAttribute("data-v"), t=S.tr;
  t.err="";
  if(a==="nope"){ t.tabHint="home"; t.step="soon"; render(); return; }
  if(a==="big"){ t.big=!t.big; render(); return; }
  if(a && a.indexOf("tab-")===0){
    var tab=a.slice(4);
    if(tab==="conv"||tab==="trip"){ t.tabHint=tab; t.step="soon"; }
    else t.step=tab;
    render(); return;
  }

  if(a==="pick-from"){ t.picking="from"; t.q=""; t.region="수도권"; t.step="station"; }
  else if(a==="pick-to"){ t.picking="to"; t.q=""; t.region="영남"; t.step="station"; }
  else if(a==="swap"){ var tmp=t.from; t.from=t.to; t.to=tmp; t.searched=false; }
  else if(a==="region"){ t.region=v; }
  else if(a==="stq"){
    var el2=document.getElementById("stQ");
    t.q=(el2?el2.value:"").trim().replace(/역$/,"");
    var found=null;
    Object.keys(RAIL.regions).forEach(function(r){
      RAIL.regions[r].forEach(function(s){ if(t.q && s===t.q) found=r; });
    });
    if(found) t.region=found;
  }
  else if(a==="pickst"){
    if(t.picking==="from") t.from=v; else t.to=v;
    t.q=""; t.picking=null; t.searched=false; t.step="home";
  }
  else if(a==="go-date"){ t.step="date"; }
  else if(a==="date"){ t.dateIdx=+v; }
  else if(a==="hour"){ t.hour=+v; }
  else if(a==="dateok"){ t.step="home"; t.searched=false; }
  else if(a==="dprev"){ if(t.dateIdx>0) t.dateIdx--; }
  else if(a==="dnext"){ if(t.dateIdx<6) t.dateIdx++; t.step="list"; }
  else if(a==="go-pax"){ t.step="pax"; }
  else if(a==="pax+"){ t.pax[v]=Math.min(9,t.pax[v]+1); }
  else if(a==="pax-"){ t.pax[v]=Math.max(0,t.pax[v]-1); }
  else if(a==="paxok"){
    if(paxCount()<1) t.err="적어도 한 분은 고르셔야 합니다.";
    else { t.step="home"; t.searched=false; }
  }
  else if(a==="go-cls"){ t.step="cls"; }
  else if(a==="pickcls"){ t.cls=v; t.step=(t.searched?"list":"home"); }
  else if(a==="simple"||a==="search"){
    if(!t.from||!t.to){ t.picking=(!t.from?"from":"to"); t.region=(!t.from?"수도권":"영남"); t.step="station"; render(); return; }
    if(t.from===t.to){ t.err="출발역과 도착역이 같습니다."; render(); return; }
    if(paxCount()<1){ t.step="pax"; render(); return; }
    t.searched=true; t.step="list"; finishCheck();
  }
  else if(a==="pick-train"){ t.train=RAIL.trains[+v]; t.seat=null; t.seatMode=null; t.step="seatmode"; }
  else if(a==="back-list"){ t.step="list"; t.hold=0; t.expired=false; }
  else if(a==="back-seatmode"){ t.step="seatmode"; }
  else if(a==="seatmode"){ t.seatMode=v; if(v==="auto"){ t.seat=null; t.step="confirm"; } else t.step="seat"; }
  else if(a==="seat"){ t.seat=v; }
  else if(a==="seatok"){ if(t.seat) t.step="confirm"; else t.err="자리를 하나 고르세요."; }
  else if(a==="book"){ t.hold=RAIL.HOLD; t.expired=false; t.step="holdpay"; }
  else if(a==="cancelhold"){ t.hold=0; t.step="list"; }
  else if(a==="topay"){ t.step="pay"; }
  else if(a==="back-hold"){ t.step="holdpay"; }
  else if(a==="back-pay"){ t.step="pay"; }
  else if(a==="paycard"){ t.pin=""; t.keymap=shuffled10(); t.step="pin"; }
  else if(a==="pin"){
    if(t.pin.length<6) t.pin+=v;
    if(t.pin.length===6){
      if(t.pin!==PIN_OK){ t.pin=""; t.keymap=shuffled10(); t.err="비밀번호가 맞지 않습니다. 연습용 번호는 112233 입니다."; }
      else { t.pin=""; finishTicket(); }
    }
  }
  else if(a==="pindel"){ t.pin=t.pin.slice(0,-1); }
  else if(a==="pinclr"){ t.pin=""; }
  else if(a==="open-ticket"){ t.viewed=true; t.step="ticket"; if(S.mission===4) finishCheck(); }
  else if(a==="go-refund"){ t.step="refund"; }
  else if(a==="go-info"){ t.step="info"; }
  else if(a==="dorefund"){
    t.fee=Math.floor(t.ticket.paid*0.05/100)*100;
    t.refunded=true; t.step="refunded"; finishCheck();
  }
  render();
}
function finishTicket(){
  var t=S.tr, x=t.train, d=trDates()[t.dateIdx];
  t.paid=true; t.hold=0;
  t.ticket={
    kind:x.kind, no:x.no, from:t.from, to:t.to, date:d.short, dep:x.dep, arr:x.arr,
    seat:t.cls+"실 "+(t.seat? t.car+"호차 "+t.seat+" ("+(/[AD]$/.test(t.seat)?"창가":"통로쪽")+")" : "자동 배정"),
    window:/[AD]$/.test(t.seat||""), pax:paxLabel(), paid:fareOf(x),
    code:"K"+(100000+Math.floor(Math.random()*899999))
  };
  t.step="done"; finishCheck();
}

/* ========== 장바구니 ========== */
function addCart(nm,pr,opts,q,base){
  var key=nm+"|"+opts.join(",");
  var hit=S.cart.filter(function(x){return x.key===key;})[0];
  if(hit) hit.qty+=q; else S.cart.push({key:key,nm:nm,pr:pr,opts:opts,qty:q,base:base||null});
}

/* ========== 키오스크 이벤트 ========== */
function act(e){
  var taxiBtn=e.target.closest("[data-x]");
  if(taxiBtn){ taxiAct(taxiBtn); return; }
  var ob=e.target.closest("[data-o]");
  if(ob){ tableAct(ob); return; }
  var tb2=e.target.closest("[data-t]");
  if(tb2){ trainAct(tb2); return; }
  var bb=e.target.closest("[data-b]");
  if(bb){ bankAct(bb); return; }
  var b=e.target.closest("[data-a]");
  if(!b){ S.left=60; paintTimer(); return; }
  var a=b.getAttribute("data-a"), v=b.getAttribute("data-v");
  S.left=60; paintTimer();

  if(a==="start"){ S.screen="serve"; }
  else if(a==="serve"){ S.serve=v; S.screen="menu"; S.cat=0; }
  else if(a==="cat"){ S.cat=+v; }
  else if(a==="sub"){ S.sub=v; }
  else if(a==="nothing"){ }
  else if(a==="restart"){ softReset(); }
  else if(a==="back"){ S.screen=(S.screen==="pay")?"cart":"menu"; }
  else if(a==="tocart"){ S.screen="cart"; }
  else if(a==="topay"){ S.screen="pay"; }
  else if(a==="paycard"){ S.screen="card"; }
  else if(a==="insert"){ S.inserting=true; }
  else if(a==="del"){ S.cart.splice(+v,1); if(!S.cart.length) S.screen="menu"; }
  else if(a==="plus"||a==="minus"){
    var itm=findItem(v), hit=S.cart.filter(function(x){return x.base===v;})[0];
    if(a==="plus"){ if(hit) hit.qty++; else addCart(itm.nm,itm.pr,[],1,v); }
    else if(hit){ hit.qty--; if(hit.qty<=0) S.cart.splice(S.cart.indexOf(hit),1); }
  }
  else if(a==="pick"){
    var it=findItem(v);
    if(S.mode==="burger"&&it.set&&S.sub==="세트"){ S.pending={item:it,kind:"세트",side:null,drink:null}; S.screen="setside"; }
    else if(S.mode==="burger"&&it.set) S.modal={kind:"set",item:it};
    else if(it.noopt) addCart(it.nm,it.pr,[],1,it.id);
    else { var gs=optionsFor(it); S.optErr="";
      S.modal={kind:"opt",item:it,groups:gs,sel:gs.map(function(g){return g.pre!=null?g.pre:null;}),qty:1}; }
  }
  else if(a==="opt"){ S.modal.sel[+b.getAttribute("data-g")]=+b.getAttribute("data-o"); S.optErr=""; }
  else if(a==="mqty"){ S.modal.qty=Math.max(1,S.modal.qty+(+v)); }
  else if(a==="close"){ S.modal=null; S.optErr=""; }
  else if(a==="addcart"){
    var m=S.modal, miss=null;
    (m.groups||[]).forEach(function(g,gi){ if(g.req&&m.sel[gi]==null) miss=g.lb; });
    if(miss){ S.optErr=miss+"을(를) 선택해 주세요."; render(); return; }
    var opts=[], add=0;
    (m.groups||[]).forEach(function(g,gi){
      var o=g.opts[m.sel[gi]];
      if(o&&o.nm!=="선택 안함"){ opts.push(o.nm); add+=(o.add||0); }
    });
    addCart(m.item.nm,m.item.pr+add,opts,m.qty,m.item.id);
    S.modal=null; S.optErr="";
  }
  else if(a==="setpick"){
    var it2=S.modal.item;
    if(v==="단품"){ addCart(it2.nm,it2.pr,["단품"],1,it2.id); S.modal=null; maybeUpsell(); }
    else { S.pending={item:it2,kind:v,side:null,drink:null}; S.modal=null; S.screen="setside"; }
  }
  else if(a==="choose"){
    var k=b.getAttribute("data-k"), list=k==="side"?D().sides:D().drinks, pick=list[+v];
    if(k==="side"){ S.pending.side=pick; S.screen="setdrink"; }
    else{
      S.pending.drink=pick;
      var p=S.pending, base=p.item.pr+(p.kind==="세트"?2200:2900)+(p.side.add||0)+(p.drink.add||0);
      addCart(p.item.nm,base,[p.kind,p.side.nm,p.drink.nm],1,p.item.id);
      S.pending=null; S.screen="menu"; maybeUpsell();
    }
  }
  else if(a==="upyes"){ addCart(S.modal.nm,S.modal.add,["추가"],1,null); S.modal=null; }
  else if(a==="upno"){ S.modal=null; }
  render();
}

/* ========== 뱅킹 이벤트 ========== */
function bankAct(btn){
  var a=btn.getAttribute("data-b"), v=btn.getAttribute("data-v"), b=S.bk;
  b.err="";

  /* 전체메뉴 · 큰글 · 세그먼트 */
  if(a==="openmenu"){ b.menu=true; render(); return; }
  if(a==="closemenu"){ b.menu=false; render(); return; }
  if(a==="big"){ b.big=!b.big; render(); return; }
  if(a==="seg"){ b.segment=v; render(); return; }
  if(a==="go-tips"){ b.menu=false; b.step="tips"; render(); return; }
  if(a==="pickacct"){ b.from=+v; b.step="history"; render(); return; }
  if(a==="fav"){
    var f=BANK.favs[+v];
    b.to=BANK.recent[f.to]; b.amt=0; b.memoTo=""; b.memoMe=""; b.step="amount";
    render(); return;
  }
  if(a && a.indexOf("tab-")===0){
    var t=a.slice(4);
    b.menu=false;
    if(t==="openmenu"){ b.menu=true; }
    else if(t==="to"){ b.step="to"; b.to=null; b.amt=0; b.memoTo=""; b.memoMe=""; b.toTab="recent"; }
    else if(t==="util"){ b.step="util"; b.bill=null; b.acctInput=""; }
    else b.step=t;
    render(); return;
  }

  /* 보안키패드 — 로그인 */
  if(a==="pin"){
    if(b.pin.length<6) b.pin+=v;
    if(b.pin.length===6){
      if(b.pin===PIN_OK){ b.pin=""; b.step="home"; }
      else { b.pin=""; b.keymap=shuffled10(); b.err="비밀번호가 맞지 않습니다. 연습용 번호는 112233 입니다."; }
    }
  }
  /* 보안키패드 — 이체 */
  else if(a==="tpin"){
    if(b.pin.length<6) b.pin+=v;
    if(b.pin.length===6){
      if(b.pin!==PIN_OK){ b.pin=""; b.keymap=shuffled10(); b.err="비밀번호가 맞지 않습니다. 연습용 번호는 112233 입니다."; }
      else {
        b.pin="";
        if(b.amt>=ARS_MIN){
          b.arsCode=String(1000+Math.floor(Math.random()*9000));
          b.arsIn=""; b.step="ars";
        } else { finishTransfer(); }
      }
    }
  }
  /* 보안키패드 — 공과금 */
  else if(a==="upin"){
    if(b.pin.length<6) b.pin+=v;
    if(b.pin.length===6){
      if(b.pin!==PIN_OK){ b.pin=""; b.keymap=shuffled10(); b.err="비밀번호가 맞지 않습니다. 연습용 번호는 112233 입니다."; }
      else { b.pin=""; b.paidBill=b.bill; b.step="paid"; finishCheck(); }
    }
  }
  else if(a==="pindel"){ b.pin=b.pin.slice(0,-1); }
  else if(a==="pinclr"){ b.pin=""; }

  /* ARS 추가인증 */
  else if(a==="ars"){
    if(b.arsIn.length<4) b.arsIn+=String(v).slice(0,4-b.arsIn.length);
    if(b.arsIn.length===4){
      if(b.arsIn===b.arsCode){ finishTransfer(); }
      else { b.arsIn=""; b.err="숫자가 다릅니다. 화면의 네 자리를 그대로 눌러 주세요."; }
    }
  }
  else if(a==="arsdel"){ b.arsIn=b.arsIn.slice(0,-1); }

  /* 조회 */
  else if(a==="showbal"){ b.balanceShown=true; if(S.mission===0) finishCheck(); }
  else if(a==="go-history"){ b.menu=false; b.step="history"; }
  else if(a==="filter"){ b.histFilter=v; }
  else if(a==="bill"){ b.foundBill=true; b.step="bill"; if(S.mission===5) finishCheck(); }

  /* 이체 */
  else if(a==="go-from"){ b.step="from"; }
  else if(a==="pickfrom"){ b.from=+v; b.step="to"; }
  else if(a==="totab"){ b.toTab=v; }
  else if(a==="pickto"){ b.to=BANK.recent[+v]; b.amt=0; b.memoTo=""; b.memoMe=""; b.step="amount"; }
  else if(a==="go-bankpick"){ b.step="bankpick"; b.bankPick=null; b.acctInput=""; }
  else if(a==="pickbank"){ b.bankPick=v; b.step="acct"; }
  else if(a==="acctok"){
    var inp=document.getElementById("acctIn");
    var raw=(inp?inp.value:"").replace(/[^0-9]/g,"");
    b.acctInput=inp?inp.value:"";
    if(raw.length<10){ b.err="계좌번호가 짧습니다. 다시 확인해 주세요."; }
    else{
      var fmt=raw.slice(0,3)+"-"+raw.slice(3,7)+"-"+raw.slice(7,11);
      var known=BANK.recent.filter(function(r){return r.acct===fmt;})[0];
      b.to={nm:(known?known.nm:"예금주 확인됨"), bank:b.bankPick, acct:fmt};
      b.amt=0; b.memoTo=""; b.memoMe=""; b.step="amount";
    }
  }
  else if(a==="num"){
    keepMemos();
    if(String(b.amt).length<9) b.amt=Number(String(b.amt===0?"":b.amt)+v);
  }
  else if(a==="numdel"){ keepMemos(); b.amt=Math.floor(b.amt/10); }
  else if(a==="amtclr"){ keepMemos(); b.amt=0; }
  else if(a==="quick"){ keepMemos(); b.amt=b.amt+Number(v); }
  else if(a==="toconfirm"){
    keepMemos();
    if(b.amt<1000) b.err="1,000원 이상 넣어 주세요.";
    else if(b.amt>acctOf().bal) b.err="출금 가능 금액보다 많습니다. 이 통장에는 "+won(acctOf().bal)+" 있습니다.";
    else if(b.amt>BANK.limitDay-BANK.usedDay) b.err="1일 이체한도를 넘습니다. 오늘 남은 한도는 "+won(BANK.limitDay-BANK.usedDay)+" 입니다.";
    else b.step="confirm";
  }
  else if(a==="go-tpin"){ b.pin=""; b.keymap=shuffled10(); b.step="tpin"; }

  /* 공과금 */
  else if(a==="pickbill"){ b.bill=v; b.acctInput=""; b.step="billno"; }
  else if(a==="billok"){
    var bi=document.getElementById("billIn");
    var raw2=(bi?bi.value:"").replace(/[^0-9]/g,"");
    b.acctInput=bi?bi.value:"";
    var want=BANK.bills[b.bill].no.replace(/[^0-9]/g,"");
    if(!raw2.length){ b.err="고지서에 적힌 번호를 넣어 주세요."; }
    else if(raw2!==want){ b.err="그런 고지서가 없습니다. 번호를 다시 확인해 주세요. (연습용 "+BANK.bills[b.bill].no+")"; }
    else b.step="billconf";
  }
  else if(a==="go-upin"){ b.pin=""; b.keymap=shuffled10(); b.step="upin"; }

  /* 보안 */
  else if(a==="go-secure"){ b.menu=false; b.step="secure"; }
  else if(a==="refuse"){ b.refused=true; b.step="secdone"; if(S.mission===6) finishCheck(); }
  else if(a==="obey"){ b.refused=false; b.step="secdone"; }

  else if(a==="home"){ b.step="home"; }
  else if(a==="history"){ b.step="history"; }
  else if(a==="amount"){ b.step="amount"; }
  else if(a==="confirm"){ b.step="confirm"; }
  else if(a==="bankpick"){ b.step="bankpick"; }
  else if(a==="billno"){ b.step="billno"; }
  else if(a==="billconf"){ b.step="billconf"; }
  else if(a==="to"){ b.step="to"; }
  else if(a==="util"){ b.step="util"; }
  else if(a==="nope"){ b.menu=false; }
  render();
}
function keepMemos(){
  var a=document.getElementById("memoTo"), b2=document.getElementById("memoMe");
  if(a) S.bk.memoTo=a.value.trim();
  if(b2) S.bk.memoMe=b2.value.trim();
}
function finishTransfer(){
  var b=S.bk;
  b.sent={nm:b.to.nm, acct:b.to.acct, bank:b.to.bank, amt:b.amt, memoTo:b.memoTo, memoMe:b.memoMe};
  b.step="sent";
  finishCheck();

/* --- 연습 기록 (기기 안에만 저장) --- */
var LKEY="kiosk-log-v1", LOG={days:{}};
function dnum(ds){ var p=String(ds).split("-"); return new Date(+p[0],(+p[1])-1,+p[2]).getTime(); }
function loadLog(){
  try{ var p=JSON.parse(localStorage.getItem(pkey(LKEY))||"null"); if(p&&p.days) LOG=p; }catch(e){}
  var lim=Date.now()-60*86400000;
  Object.keys(LOG.days).forEach(function(ds){ if(dnum(ds)<lim) delete LOG.days[ds]; });
}
function saveLog(){ try{ localStorage.setItem(pkey(LKEY),JSON.stringify(LOG)); }catch(e){} }
function dayLog(ds){ ds=ds||todayStr(); return LOG.days[ds]||(LOG.days[ds]={}); }
function logEntry(key){ var d=dayLog(); return d[key]||(d[key]={n:0,w:0,h:0,b:0,f:0,ok:0,s:0}); }
function logBump(key,f,n){ if(!key) return; var e=logEntry(key); e[f]=(e[f]||0)+n; saveLog(); }

/* 지금 하고 있는 한 번의 시도 */
var ATT=null, LASTRES=null, NOOP=0, AUTO=false, IDLE=0, UNDO=[];
function beginAttempt(){
  var k=mkey(S.mode,S.mission);
  if(ATT && ATT.key===k && !ATT.done) return;
  ATT={key:k,t0:Date.now(),w:0,h:0,b:0,done:false};
  logBump(k,"n",1);
}
function attStat(f,n){ if(ATT){ ATT[f]+=n; logBump(ATT.key,f,n); } }
function logClear(mode,mi){
  var k=mkey(mode,mi), e=logEntry(k), sec=0;
  if(ATT && ATT.key===k){ sec=Math.max(1,Math.round((Date.now()-ATT.t0)/1000)); ATT.done=true;
    LASTRES={w:ATT.w,h:ATT.h,b:ATT.b,s:sec}; }
  else LASTRES=null;
  e.ok=1; if(sec && (!e.s || sec<e.s)) e.s=sec;
  saveLog();
}
function logFail(){ if(ATT){ logBump(ATT.key,"f",1); ATT.done=true; } }
function secTxt(s){ if(!s) return "-"; var m=Math.floor(s/60), r=s%60; return (m?m+"분 ":"")+r+"초"; }

/* 지난 기록에서 다시 해볼 미션 — 마지막으로 했을 때 못 끝냈거나, 많이 헤맸거나, 반짝임 도움을 받은 것 */
function reviewList(){
  var today=todayStr(), agg={};
  Object.keys(LOG.days).forEach(function(ds){
    if(ds===today) return;
    var d=LOG.days[ds];
    Object.keys(d).forEach(function(k){
      var e=d[k], a=agg[k]||(agg[k]={t:0,bad:false});
      if(dnum(ds)>=a.t){ a.t=dnum(ds); a.bad=(!e.ok || e.w>=4 || e.h>=1); }
    });
  });
  var td=LOG.days[today]||{};
  return Object.keys(agg).filter(function(k){
    if(!agg[k].bad) return false;
    if(td[k] && td[k].ok) return false;
    var p=k.split(":"); return MISSIONS[p[0]] && MISSIONS[p[0]][+p[1]];
  }).sort(function(a,b){ return agg[b].t-agg[a].t; })
    .map(function(k){ var p=k.split(":"); return {mode:p[0],mi:+p[1]}; });
}

/* 오늘의 세 가지 — 반에 맞춰 고르고, 다시 해볼 것이 있으면 하나를 끼워 넣습니다 */
function makePlan(ds){
  var cls=S.cls, basic=[], adv=[];
  Object.keys(MISSIONS).forEach(function(m){ MISSIONS[m].forEach(function(_,i){
    (lvOf(m,i)==="어려움"?adv:basic).push({mode:m,mi:i}); }); });
  var h=h32(ds+cls), out=[], used={};
  function pick(pool,n){
    var g=0;
    while(out.length<n && g++<300){
      h=(h*1103515245+12345)&0x7fffffff;
      var c=pool[h%pool.length], k=mkey(c.mode,c.mi);
      if(!used[k]){ used[k]=1; out.push({mode:c.mode,mi:c.mi}); }
    }
  }
  pick(cls==="어려움"?adv:basic,2);
  var rv=reviewList().filter(function(x){return cls==="어려움" || lvOf(x.mode,x.mi)==="초보자용";});
  for(var i=0;i<rv.length && out.length<3;i++){
    var k=mkey(rv[i].mode,rv[i].mi);
    if(!used[k]){ used[k]=1; out.push({mode:rv[i].mode,mi:rv[i].mi,r:1}); }
  }
  pick(basic,3);
  return out;
}

function toast(msg,ok){
  var t=document.getElementById("ktoast");
  if(!t){ t=document.createElement("div"); t.id="ktoast"; t.className="ktoast"; t.setAttribute("role","status"); el.device.appendChild(t); }

  clearTimeout(toastT); toastT=setTimeout(function(){ t.hidden=true; },ok?3200:2800);

function tapFx(e,hit){
  var r=el.device.getBoundingClientRect(), s=document.createElement("span");
  s.className="tapfx"+(hit?"":" miss");
  s.style.left=(e.clientX-r.left)+"px"; s.style.top=(e.clientY-r.top)+"px";
  el.device.appendChild(s); setTimeout(function(){ s.remove(); },460);

function missLimit(){ return S.cls==="어려움"?3:2; }
function idleLimit(){ return S.cls==="어려움"?35:20; }
function onNoop(hitBtn){
  NOOP++; attStat("w",1);
  if(!hitBtn && NOOP===1){ toast("여기는 누르는 곳이 아닙니다. 테두리가 있는 단추를 눌러 보세요."); }
  if(NOOP>=missLimit() && !S.hints && !AUTO && HINT){
    AUTO=true; attStat("h",1);
    if(hintNow()) toast("헷갈리시면 반짝이는 곳을 눌러 보세요.");
  }
}
function idleTick(){
  if(S.mode==="lobby" || S.picker || S.hints || AUTO || S.timedout || !HINT) { IDLE=0; return; }
  if(S.screen==="done") return;
  IDLE++;
  if(IDLE>=idleLimit()){
    IDLE=0;
    if(hintNow()){ AUTO=true; attStat("h",1); toast("어디를 누를지 고민되시면 반짝이는 곳을 보세요."); }
  }
}

/* 메뉴 화면 힌트 — 미션에 필요한 메뉴(없으면 그 메뉴가 있는 탭)를 가리킵니다 */
function menuHint(){
  if(S.cart.length && missingNeed()===null) return '.cartbar .go';
  var id=missingNeed(); if(!id) return S.cart.length?'.cartbar .go':'.tile:not([disabled])';
  var d=D(), want=null, ci=-1;
  d.cats.forEach(function(c,i){ c.items.forEach(function(it){ if(it.id===id && ci<0){ want=it; ci=i; } }); });
  if(!want) return '.tile:not([disabled])';
  var here=null;
  d.cats[S.cat].items.forEach(function(it){ if(!here && it.nm===want.nm && !it.sold) here=it; });
  if(here){
    if(S.mode==="snack" && !here.spice) return '[data-a="plus"][data-v="'+here.id+'"]';
    return '[data-a="pick"][data-v="'+here.id+'"]';
  }
  return '[data-a="cat"][data-v="'+ci+'"]';
}
function missingNeed(){
  var list=(NEED[S.mode]||[])[S.mission]; if(!list) return undefined;
  var d=D();
  for(var i=0;i<list.length;i++){
    var nm=null;
    d.cats.forEach(function(c){ c.items.forEach(function(it){ if(it.id===list[i]) nm=it.nm; }); });
    if(nm && !S.cart.some(function(x){ return x.nm===nm; })) return list[i];
  }
  return null;
}

function pickUser(id){
  var u=findUser(id); if(!u || u.portalDemo) return;
  if(id===USERS.cur){ S.lv="home"; render(); el.screen.scrollTop=0; return; }
  if(u.pin){ S.uq=id; S.uqpin=""; S.uerr=""; render(); el.screen.scrollTop=0; return; }
  enterUser(id);
}
function enterUser(id){
  if(!USERS.cur && slotHas("") && !slotHas(id)){ S.umove=id; S.uerr=""; render(); el.screen.scrollTop=0; return; }
  finishUser(id);
}
function finishUser(id){
  var u=findUser(id), nm=u?u.nm:"";
  useUser(id);
  S.uq=null; S.umove=null; S.uerr=""; S.uqpin="";
  paintDaily(); render(); el.screen.scrollTop=0;
  toast(nm+"님으로 기록합니다. 다음에 오셔도 이어집니다.",true);
}

function storeName(m){ return (DATA[m]&&DATA[m].store)||m; }
function plainMission(m,i){ return MISSIONS[m][i].t.replace(/<[^>]+>/g,"").replace(/\s*\([^)]*\)\s*$/,"").replace(/\s+/g," ").trim(); }
var W7=["일","월","화","수","목","금","토"];
function dlabel(ds){ var d=new Date(dnum(ds)); return (d.getMonth()+1)+"월 "+d.getDate()+"일("+W7[d.getDay()]+")"; }
function dayTotals(ds){
  var d=LOG.days[ds]||{}, t={ok:0,w:0,h:0,n:0};
  Object.keys(d).forEach(function(k){ var e=d[k]; t.ok+=e.ok?1:0; t.w+=e.w||0; t.h+=e.h||0; t.n+=e.n||0; });
  return t;
}
function recordText(){
  var nm=(S.name||"").trim(), lines=[];
  if(S.recRange==="week"){
    var days=[], i, now=Date.now();
    for(i=6;i>=0;i--) days.push(dstr(new Date(now-i*86400000)));
    var att=0, ok=0, w=0, h=0;
    days.forEach(function(ds){ var t=dayTotals(ds); if((DAILY.hist||[]).indexOf(ds)>-1) att++; ok+=t.ok; w+=t.w; h+=t.h; });
    lines.push("## 최근 7일 연습 기록 ("+dlabel(days[0])+" ~ "+dlabel(days[6])+")");
    if(nm) lines.push("- 이름: "+nm);
    lines.push("- 난이도: "+S.cls);
    lines.push("- 연습한 날: "+att+"일 / 마친 연습: "+ok+"개 / 헤맨 횟수: "+w+"번 / 반짝임 도움: "+h+"번");
    lines.push(""); lines.push("### 날짜별");
    days.forEach(function(ds){ var t=dayTotals(ds);
      lines.push("- "+dlabel(ds)+": "+(t.n? "마친 연습 "+t.ok+"개, 헤맴 "+t.w+"번" : "연습 안 함")); });
    var rv=reviewList().slice(0,3);
    if(rv.length){ lines.push(""); lines.push("### 다시 해볼 연습");
      rv.forEach(function(r){ lines.push("- "+storeName(r.mode)+" — "+plainMission(r.mode,r.mi)); }); }
  } else {
    var ds=todayStr(), d=LOG.days[ds]||{}, t=dayTotals(ds);
    lines.push("## "+dlabel(ds)+" 연습 기록");
    if(nm) lines.push("- 이름: "+nm);
    lines.push("- 난이도: "+S.cls);
    lines.push("- 출석: "+(DAILY.attended?"함 (연속 "+(DAILY.streak||0)+"일째)":"아직"));
    lines.push("- 마친 연습: "+t.ok+"개 / 헤맨 횟수: "+t.w+"번 / 반짝임 도움: "+t.h+"번");
    lines.push(""); lines.push("### 연습한 것");
    var ks=Object.keys(d);
    if(!ks.length) lines.push("- 오늘은 아직 연습하지 않았습니다.");
    ks.forEach(function(k){ var e=d[k], p=k.split(":");
      if(!MISSIONS[p[0]]||!MISSIONS[p[0]][+p[1]]) return;
      lines.push("- ["+(e.ok?"x":" ")+"] "+storeName(p[0])+" — "+plainMission(p[0],+p[1])
        +" (시도 "+e.n+"번, 헤맴 "+e.w+"번"+(e.b?", 뒤로 "+e.b+"번":"")+(e.ok&&e.s?", "+secTxt(e.s):"")+")"); });
  }
  lines.push(""); lines.push("### 막혔던 곳 · 궁금한 점"); lines.push("- ");
  return lines.join("\n");
}
function recordHTML(txt){
  return txt.split("\n").map(function(l){
    if(/^## /.test(l)) return '<div class="rph">'+esc(l.slice(3))+'</div>';
    if(/^### /.test(l)) return '<div class="rph3">'+esc(l.slice(4))+'</div>';
    if(/^- \[x\] /.test(l)) return '<div class="rpli"><span class="rk">마침</span>'+esc(l.slice(6))+'</div>';
    if(/^- \[ \] /.test(l)) return '<div class="rpli"><span class="rk no">아직</span>'+esc(l.slice(6))+'</div>';
    if(/^- $/.test(l)) return '<div class="rpli rpblank">(여기에 적으시면 됩니다)</div>';
    if(/^- /.test(l)) return '<div class="rpli"><span class="bu"></span>'+esc(l.slice(2))+'</div>';
    return '';
  }).join("");
}

function copyRecord(btn){
  var txt=recordText(), ta=document.getElementById("recText");
  function done(){ btn.classList.add("done"); btn.innerHTML=CI("copy")+'복사했습니다'; toast("복사했습니다. 노션의 내 연습 기록 페이지에 붙여넣으세요.",true);
    setTimeout(function(){ if(btn.isConnected){ btn.classList.remove("done"); btn.innerHTML=CI("copy")+'기록 복사하기'; } },2600); }
  function fallback(){
    var ok=false;
    try{ ta.removeAttribute("readonly"); ta.focus(); ta.select(); ta.setSelectionRange(0,txt.length); ok=document.execCommand("copy"); }catch(x){}
    ta.setAttribute("readonly",""); try{ ta.blur(); }catch(x){}
    if(ok) done(); else toast("자동 복사가 막혀 있습니다. 위 글을 길게 눌러 ‘모두 선택’ 후 ‘복사’를 누르세요.");
  }
  try{
    if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(txt).then(done,fallback); return; }
  }catch(x){}
  fallback();
}
function lobbyAct(lb){
  var a=lb.getAttribute("data-l"), v=lb.getAttribute("data-v");
  if(a==="tutorial"){startTutorial();return;}
  if(a==="install"){
    if(installPrompt){ installPrompt.prompt(); installPrompt=null; render(); }
    return;
  }
  if(a==="maploc"){findNearby();return;}
  if(a==="mapcat"){setMapCategory(v);return;}
  if(a==="demologin"){
    var demoInput=document.getElementById("demoId"), passwordInput=document.getElementById("demoPassword");
    var password=passwordInput?passwordInput.value:"";
    if(passwordInput) passwordInput.value="";
    loginPortalDemo(demoInput?demoInput.value:S.demoId,password,S.demoProvider); return;
  }
  if(a==="demologout"){
    useUser(""); S.demoProvider=""; S.demoError=""; paintDaily(); render(); el.screen.scrollTop=0;
    toast("로그아웃했습니다. 손님으로 계속 연습할 수 있습니다."); return;
  }
  if(a==="orgsave"){
    var selected=document.getElementById("orgCurrent"), u=curUser();
    if(u && selected){u.org=selected.value;saveUsers();S.lv="home";render();toast("도서관 이름을 화면에 표시했습니다.");}
    return;
  }
  if(a==="big"){ S.big=!S.big; if(S.bk)S.bk.big=S.big; if(S.tr)S.tr.big=S.big; save(); render(); return; }
  if(a==="lv"){ S.lv=v; S.uq=null; S.umove=null; S.uerr=""; render(); el.screen.scrollTop=0; return; }
  if(a==="user"){ pickUser(v); return; }
  if(a==="unew"){
    var unm=(S.ufnm||"").trim(), upn=(S.ufpin||"").replace(/[^0-9]/g,"");
    if(!unm){ S.uerr="이름을 적어 주세요."; render(); return; }
    if(upn && upn.length!==4){ S.uerr="숫자는 네 자리로 적어 주세요. 안 적어도 됩니다."; render(); return; }
    var uid=newUser(unm.slice(0,12),upn,S.uorg);
    S.ufnm=""; S.ufpin=""; S.uorg=""; S.uerr="";
    enterUser(uid); return;
  }
  if(a==="uok"){
    var qu=findUser(S.uq);
    if(!qu){ S.uq=null; render(); return; }
    if((S.uqpin||"")!==qu.pin){ S.uerr="숫자가 다릅니다. 다시 눌러 주세요."; S.uqpin=""; render(); return; }
    var qid=S.uq; S.uq=null; S.uqpin=""; S.uerr=""; enterUser(qid); return;
  }
  if(a==="umove"){
    var mid=S.umove; S.umove=null;
    if(!mid){ render(); return; }
    if(v==="yes") moveGuestTo(mid);
    finishUser(mid); return;
  }
  if(a==="guest"){
    useUser(""); S.uq=null; S.umove=null; S.uerr="";
    paintDaily(); render(); el.screen.scrollTop=0;
    toast("손님으로 바꿨습니다. 연습과 출석은 그대로 됩니다."); return;
  }
  if(a==="cls"){
    if(v!=="초보자용" && v!=="어려움") return;
    var changed=S.cls!==v;
    S.cls=v; S.timerOn=(v==="어려움");
    el.timer.setAttribute("aria-pressed",String(S.timerOn));
    if(changed){ DAILY.plan=makePlan(DAILY.date); DAILY.pcls=v; saveDaily(); }
    save(); S.lv="home"; render(); el.screen.scrollTop=0;
    toast(v+"으로 바꿨습니다."+(changed?" 오늘 할 연습도 새로 골랐습니다.":""),true);
    return;
  }
  if(a==="range"){ S.recRange=v; render(); return; }
  if(a==="htab"){ S.helpTab=v; render(); return; }
  if(a==="copy"){ copyRecord(lb); return; }
  setMode(lb.getAttribute("data-m"));
  if(lb.getAttribute("data-i")!=null) S.mission=+lb.getAttribute("data-i");
  if(S.bk)S.bk.big=S.big; if(S.tr)S.tr.big=S.big;
  render();
}

function tutorialSeen(){try{return localStorage.getItem(TUTORIAL_KEY)==="1";}catch(e){return false;}}
function stopTutorial(){
  tutorialStep=-1;
  if(tutorialLayer){tutorialLayer.remove();tutorialLayer=null;}
  try{localStorage.setItem(TUTORIAL_KEY,"1");}catch(e){}
}
function startTutorial(){
  if(tutorialLayer) tutorialLayer.remove();
  if(S.picker){S.picker=false;paintPicker();}
  setMode("lobby");render();el.screen.scrollTop=0;
  tutorialStep=0;
  tutorialLayer=document.createElement("div");
  tutorialLayer.className="tutorial-layer";
  document.body.appendChild(tutorialLayer);
  tutorialLayer.addEventListener("click",function(e){
    var action=e.target.closest("[data-tutorial]");
    if(!action) return;
    if(action.dataset.tutorial==="stop"){stopTutorial();return;}
    if(tutorialStep===0){tutorialStep=1;paintTutorial();}
    else if(tutorialStep===TUTORIAL.length-1) stopTutorial();
  });
  paintTutorial();
}
function paintTutorial(){
  if(tutorialStep<0||!tutorialLayer) return;
  /* 미션은 기본적으로 접혀 있습니다. */
  if(tutorialStep===4&&S.missionOpen) tutorialStep=5;
  var step=TUTORIAL[tutorialStep], sel=typeof step.target==="function"?step.target():step.target;
  var target=sel?document.querySelector(sel):null;
  if(sel&&!target){stopTutorial();return;}
  if(target) target.scrollIntoView({block:"nearest",behavior:"auto"});
  var box=target?target.getBoundingClientRect():null, w=innerWidth,h=innerHeight;
  var left=box?Math.max(0,box.left-7):0,top=box?Math.max(0,box.top-7):0;
  var right=box?Math.min(w,box.right+7):0,bottom=box?Math.min(h,box.bottom+7):0;
  var rects=box?[[0,0,w,top],[0,bottom,w,h-bottom],[0,top,left,bottom-top],[right,top,w-right,bottom-top]]:[[0,0,w,h]];
  tutorialLayer.innerHTML=rects.map(function(r){return '<div class="tutorial-shade" style="left:'+r[0]+'px;top:'+r[1]+'px;width:'+Math.max(0,r[2])+'px;height:'+Math.max(0,r[3])+'px"></div>';}).join("")
    +(box?'<div class="tutorial-ring" style="left:'+left+'px;top:'+top+'px;width:'+(right-left)+'px;height:'+(bottom-top)+'px"></div>':"")
    +'<div class="tutorial-card" role="dialog" aria-label="이용 안내" aria-live="polite">'
    +'<small>'+(tutorialStep===0?'시작하기':tutorialStep===TUTORIAL.length-1?'안내 완료':tutorialStep+' / '+(TUTORIAL.length-2))+'</small>'
    +'<h2>'+step.title+'</h2><p>'+step.body+'</p><div class="tutorial-actions">'
    +(sel?'<button class="tutorial-stop" data-tutorial="stop">그만보기</button>':'<button class="tutorial-stop" data-tutorial="stop">'+(tutorialStep===0?'나중에':'닫기')+'</button><button class="tutorial-next" data-tutorial="next">'+(tutorialStep===0?'시작하기':'끝내기')+'</button>')
    +'</div></div>';
  var card=tutorialLayer.querySelector('.tutorial-card');
  var cw=card.offsetWidth,ch=card.offsetHeight;
  card.style.left=Math.max(12,Math.min(w-cw-12,box?box.left:Math.round((w-cw)/2)))+'px';
  card.style.top=(box?(h-bottom>=ch+16?Math.min(h-ch-12,bottom+12):Math.max(12,top-ch-12)):Math.max(12,Math.round((h-ch)/2)))+'px';
}
document.addEventListener("click",function(e){
  if(tutorialStep<1||tutorialStep>=TUTORIAL.length-1||!tutorialLayer) return;
  if(tutorialLayer.contains(e.target)) return;
  var step=TUTORIAL[tutorialStep],sel=typeof step.target==="function"?step.target():step.target;
  var target=document.querySelector(sel);
  if(!target||!target.contains(e.target)){e.preventDefault();e.stopPropagation();return;}
  setTimeout(function(){if(tutorialStep>=0&&TUTORIAL[tutorialStep]===step&&step.done()){tutorialStep++;paintTutorial();}},30);
},true);
document.addEventListener("keydown",function(e){if(tutorialStep>=0&&e.key==="Escape") stopTutorial();});
window.addEventListener("resize",function(){if(tutorialStep>=0)paintTutorial();});
document.addEventListener("scroll",function(){if(tutorialStep>=0)paintTutorial();},true);

function boot(saved){
  if('serviceWorker' in navigator && location.protocol==='https:'){
    navigator.serviceWorker.register('./sw.js').catch(function(){});
  }
  loadUsers(); loadDemoSession();
  if(curUser() && curUser().portalDemo && !demoInstitution()){ USERS.cur=""; saveUsers(); }
  loadLog(); loadPref(); loadDaily();
  if(userName()) S.name=userName();
  el.timer.setAttribute("aria-pressed",String(S.timerOn));
  if(saved&&saved.mode&&(saved.mode==="lobby"||MISSIONS[saved.mode])){ S.mode=saved.mode; S.mission=saved.mission||0; }
  S.missionOpen=false;
  [].forEach.call(el.ms.querySelectorAll("button"),function(x){
    x.setAttribute("aria-pressed", String(x.getAttribute("data-m")===S.mode));
  });
  paintDaily(); resetTimer(); startTick(); render();
  if(!tutorialSeen()) startTutorial();
}
if(window.claude&&window.claude.hot){
  window.claude.hot.snapshot(function(){ return {mode:S.mode,mission:S.mission}; });
  window.claude.hot.ready ? window.claude.hot.ready(boot) : boot(window.claude.hot.data||{});
} else { boot({}); }

})();
