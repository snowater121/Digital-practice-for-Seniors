<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="공공도서관 디지털 교육용 연습 앱 — 키오스크·모바일 뱅킹·기차 예매·테이블 오더 연습 (연습용, 실제 결제 없음)">
<meta name="theme-color" content="#1A3D7C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="디지털 연습소">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<link rel="stylesheet" href="./vendor/leaflet/leaflet.css">
<title>디지털 연습소</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Do+Hyeon&family=Gothic+A1:wght@400;500;700;900&family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<style>body{margin:0}</style>
</head>
<body>
<style>
/* 연습소 바깥 틀(도구)은 차가운 무채색, 안쪽 화면은 업종별 브랜드 토큰으로 갈아끼웁니다. */
:root{
  --shell-bg:#0B0D10;
  --shell-panel:#14171C;
  --shell-line:#232931;
  --shell-fg:#E8EBF0;
  --shell-mut:#8D97A5;
  --amber:#4F7CC4;        /* 도구 UI 강조색 — 매장 브랜드와 겹치지 않는 차분한 청색 */
  --amber-dim:#2B4470;
  --good:#2FB37A;
  --bad:#E0574B;

  /* 매장 토큰 — 기본값은 카페 */
  --brand:#143A2B;  --brand-on:#FFFFFF;
  --accent:#4E9C7E; --accent-on:#FFFFFF;
  --k-bg:#EFF2F1;   --k-card:#FFFFFF; --k-line:#DBE2DF;
  --k-fg:#101A15;   --k-mut:#5E6C66;

  --font-ui:'Gothic A1','Noto Sans KR',-apple-system,BlinkMacSystemFont,sans-serif;
  --font-k:'Gothic A1','Noto Sans KR',sans-serif;
  --font-disp:'Gothic A1','Noto Sans KR',sans-serif;
}
/* 카페 — 딥 그린 + 세이지. 상단 가로 탭, 3열, 큰 상품 이미지 */
[data-mode="cafe"]{
  --brand:#143A2B; --brand-on:#FFFFFF; --accent:#4E9C7E; --accent-on:#FFFFFF;
  --k-bg:#EFF2F1; --k-card:#FFFFFF; --k-line:#DBE2DF; --k-fg:#101A15; --k-mut:#5E6C66;
  --font-k:'Gothic A1','Noto Sans KR',sans-serif;
  --font-disp:'Gothic A1','Noto Sans KR',sans-serif;
}
/* 패스트푸드 — 고채도 레드 + 옐로 가격배지. 좌측 세로 레일, 2열, 아주 큰 이미지 */
[data-mode="burger"]{
  --brand:#C62828; --brand-on:#FFFFFF; --accent:#F7B500; --accent-on:#1A1A1A;
  --k-bg:#F3F4F6; --k-card:#FFFFFF; --k-line:#E2E4E9; --k-fg:#16181C; --k-mut:#697079;
  --font-k:'Noto Sans KR',sans-serif;
  --font-disp:'Black Han Sans','Noto Sans KR',sans-serif;
}
/* 분식 — 진한 적색 + 먹색. 한 화면에 전체 메뉴, 타일 안에서 바로 수량 조절 */
[data-mode="snack"]{
  --brand:#B8362A; --brand-on:#FFFFFF; --accent:#17202A; --accent-on:#FFFFFF;
  --k-bg:#F2F3F5; --k-card:#FFFFFF; --k-line:#E1E4E9; --k-fg:#13171C; --k-mut:#626B76;
  --font-k:'Noto Sans KR',sans-serif;
  --font-disp:'Do Hyeon','Noto Sans KR',sans-serif;
}
/* 기차 예매 — 철도 앱 계열의 짙은 남색 + 중립 회색 */
[data-mode="train"]{
  --brand:#15468C; --brand-on:#FFFFFF; --accent:#1D8FD1; --accent-on:#FFFFFF;
  --k-bg:#F1F3F7; --k-card:#FFFFFF; --k-line:#DDE1E9; --k-fg:#121722; --k-mut:#5F6878;
  --font-k:'Noto Sans KR',sans-serif;
  --font-disp:'Gothic A1','Noto Sans KR',sans-serif;
}
/* 모바일 뱅킹 — 금융권 표준에 가깝게 그린 + 중립 회색. 디스플레이 폰트 쓰지 않음 */
[data-mode="bank"]{
  --brand:#1C6B3C; --brand-on:#FFFFFF; --accent:#2F80ED; --accent-on:#FFFFFF;
  --k-bg:#F1F3F5; --k-card:#FFFFFF; --k-line:#DDE1E6; --k-fg:#111417; --k-mut:#636E79;
  --font-k:'Noto Sans KR',sans-serif;
  --font-disp:'Noto Sans KR',sans-serif;
}
/* 모바일 택시 연습 — 지도와 하단 선택 카드 */
[data-mode="taxi"]{--k-bg:#F5F6FA;--k-fg:#20242B;--font-k:'Noto Sans KR',sans-serif;--font-disp:'Noto Sans KR',sans-serif}

html,body{height:100%;}
body{
  margin:0;background:var(--shell-bg);color:var(--shell-fg);
  font-family:var(--font-ui);-webkit-font-smoothing:antialiased;
  overscroll-behavior:none;
}
*{box-sizing:border-box}
button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px}

/* ===== shell ===== */
.app{height:100%;display:flex;flex-direction:column;max-width:520px;margin:0 auto;background:var(--shell-bg)}

.topbar{
  flex:none;background:var(--shell-panel);border-bottom:1px solid var(--shell-line);
  padding:9px 14px;display:flex;flex-direction:column;gap:7px;
}
.brandrow{display:flex;align-items:center;gap:8px}
.logo{font-family:var(--font-disp);font-size:15px;letter-spacing:.02em;color:var(--amber)}

/* 매일 연습 띠 */
.daily{display:flex;align-items:center;gap:9px;background:#0E1016;border:1px solid var(--shell-line);
  border-radius:8px;padding:7px 10px}
.streak{display:flex;align-items:center;gap:5px;font-size:12px;font-weight:900;color:var(--amber);flex:none}
.streak .fire{font-size:14px;line-height:1}
.pips{display:flex;gap:4px;flex:none}
.pips i{width:9px;height:9px;border-radius:50%;background:var(--shell-line);display:block}
.pips i.on{background:var(--good)}
.daily .dtx{flex:1;min-width:0;font-size:11px;color:var(--shell-mut);line-height:1.35}
.daily .dtx b{color:var(--shell-fg);font-weight:700}
.daily .dgo{flex:none;font-size:11px;font-weight:800;background:var(--amber);color:#fff;
  padding:6px 10px;border-radius:6px;white-space:nowrap}
.daily.allclear{border-color:#3FB57C66;background:#3FB57C14}

.modeswitch{margin-left:auto;display:flex;gap:4px;background:#0E1016;padding:3px;border-radius:999px;border:1px solid var(--shell-line);overflow-x:auto}
.modeswitch::-webkit-scrollbar{height:0}
.modeswitch button{
  font-size:11px;font-weight:700;padding:5px 9px;border-radius:999px;color:var(--shell-mut);white-space:nowrap
}
.modeswitch button[aria-pressed="true"]{background:var(--amber);color:#fff}

.mission{
  display:flex;gap:9px;align-items:flex-start;
  background:#0E1016;border:1px solid var(--shell-line);border-left:3px solid var(--amber);
  border-radius:8px;padding:9px 11px;
}
.mission .tag{
  font-size:9.5px;font-weight:900;letter-spacing:.14em;color:var(--amber);
  border:1px solid var(--amber-dim);border-radius:4px;padding:2px 5px;flex:none;margin-top:1px
}
.mission p{margin:0;font-size:12.5px;line-height:1.45;font-weight:500;flex:1}
.mission .swap{font-size:11px;color:var(--shell-mut);text-decoration:underline;flex:none;padding:2px}

/* ===== device ===== */
.stage{flex:1;min-height:0;padding:10px 12px;display:flex;position:relative}
.device{
  flex:1;min-height:0;position:relative;border-radius:14px;overflow:hidden;
  border:6px solid #050608;box-shadow:0 0 0 1px #2A2F3A, 0 14px 34px rgba(0,0,0,.6);
  background:var(--k-bg);display:flex;flex-direction:column;
}
.screen{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;color:var(--k-fg);position:relative;display:flex;flex-direction:column}
.screen>.attract,.screen>.serve,.screen>.pay,.screen>.cardscr,.screen>.done,.screen>.bapp,.screen>.split,.screen>.kpad{flex:1}
.screen>.grid,.screen>.clist{flex:1;align-content:flex-start}
.kbar,.cats,.cartbar,.note,.sumline{flex:none}
.screen::-webkit-scrollbar{width:0}

.timeout{flex:none;height:3px;background:#00000018}
.timeout i{display:block;height:100%;background:var(--bad);width:100%;transition:width 1s linear}

/* ===== controls ===== */
.controls{
  flex:none;background:var(--shell-panel);border-top:1px solid var(--shell-line);
  padding:9px 12px calc(9px + env(safe-area-inset-bottom,0px));
  display:flex;gap:7px;align-items:center;
}
.ctl{
  flex:1;font-size:11.5px;font-weight:700;padding:9px 6px;border-radius:8px;
  border:1px solid var(--shell-line);background:#0E1016;color:var(--shell-fg);
  display:flex;align-items:center;justify-content:center;gap:5px;
}
.ctl[aria-pressed="true"]{background:var(--amber);color:#fff;border-color:var(--amber)}
.ctl small{font-size:10px;font-weight:500;color:var(--shell-mut)}
.ctl[aria-pressed="true"] small{color:rgba(255,255,255,.8)}

/* ===== KIOSK UI ===== */
.kpad{padding:12px}
.kbar{
  background:var(--brand);color:var(--brand-on);padding:9px 12px;
  display:flex;align-items:center;gap:8px;font-size:12px;position:sticky;top:0;z-index:5
}
.kbar .kname{font-family:var(--font-disp);font-size:14px;letter-spacing:.02em}
.kbar .kserve{
  margin-left:auto;font-size:10.5px;font-weight:700;background:rgba(255,255,255,.18);
  padding:3px 8px;border-radius:4px
}
.kback{font-size:11px;font-weight:700;background:rgba(255,255,255,.14);padding:4px 8px;border-radius:4px;color:var(--brand-on)}

.attract{min-height:100%;display:flex;flex-direction:column;background:var(--brand);color:var(--brand-on);text-align:center}
.attract .ad{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:26px 18px;
  background:radial-gradient(120% 80% at 50% 0%, rgba(255,255,255,.14), transparent 60%),var(--brand);
}
.attract .kicker{font-size:11px;font-weight:700;letter-spacing:.24em;color:var(--accent)}
.attract h1{font-family:var(--font-disp);font-size:clamp(30px,10vw,44px);line-height:1.12;margin:0;text-wrap:balance}
.attract .sub{font-size:12.5px;opacity:.72;margin:0;line-height:1.6}
.attract .promo{margin-top:6px;background:var(--accent);color:var(--accent-on);font-size:11.5px;font-weight:900;padding:7px 14px;border-radius:999px}
.touchbtn{flex:none;background:var(--accent);color:var(--accent-on);font-family:var(--font-disp);font-size:20px;padding:20px;width:100%;letter-spacing:.02em}
.touchbtn span{display:block;font-family:var(--font-ui);font-size:11px;font-weight:500;opacity:.68;margin-top:3px}

.serve{min-height:100%;display:flex;flex-direction:column;justify-content:center;gap:12px;padding:20px 16px;background:var(--k-bg)}
.serve h2{font-family:var(--font-disp);font-size:22px;text-align:center;margin:0 0 4px;color:var(--k-fg)}
.serve .row{display:flex;gap:10px}
.serve button{flex:1;background:var(--k-card);border:2px solid var(--k-line);border-radius:10px;padding:26px 10px;display:flex;flex-direction:column;align-items:center;gap:8px;color:var(--k-fg)}
.serve button .ico{font-size:30px;line-height:1}
.serve button b{font-size:15px}
.serve button small{font-size:10.5px;color:var(--k-mut)}

/* 카테고리 탭 — 카페·분식: 상단 가로 스크롤 */
.cats{display:flex;gap:0;overflow-x:auto;background:var(--k-card);border-bottom:1px solid var(--k-line);position:sticky;top:0;z-index:4}
.cats::-webkit-scrollbar{height:0}
.cats button{flex:none;padding:13px 15px;font-size:13.5px;font-weight:700;color:var(--k-mut);white-space:nowrap;
  border-bottom:3px solid transparent;font-family:var(--font-k)}
.cats button[aria-pressed="true"]{color:var(--brand);border-bottom-color:var(--brand)}
[data-mode="snack"] .cats button{font-family:var(--font-disp);font-size:15px;letter-spacing:.01em}

/* 상품 격자 */
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;padding:11px}
.grid.two{grid-template-columns:repeat(2,1fr);gap:10px;padding:10px}

.tile{
  background:var(--k-card);border:1px solid var(--k-line);border-radius:12px;
  padding:10px 7px 12px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;
  color:var(--k-fg);position:relative;min-height:162px;justify-content:flex-start;font-family:var(--font-k)
}
.tile .art{width:100%;max-width:84px;aspect-ratio:1/1;display:block;flex:none}
.tile .art svg{width:100%;height:100%;display:block}
.tile .nm{font-size:12.5px;font-weight:700;line-height:1.3;word-break:keep-all;margin-top:auto}
.tile .pr{font-size:13px;font-weight:800;font-variant-numeric:tabular-nums}
.tile .flag{position:absolute;top:6px;left:6px;font-size:9.5px;font-weight:900;padding:3px 6px;border-radius:4px;
  background:var(--brand);color:var(--brand-on);letter-spacing:.02em}
.tile .soldout{position:absolute;inset:0;background:rgba(255,255,255,.78);display:flex;align-items:center;
  justify-content:center;font-size:12.5px;font-weight:900;color:#9AA2AA;border-radius:12px}
.tile .cnt{font-size:11px;font-weight:800;color:var(--brand)}

/* 카페 — 담백한 고딕, 가격은 본문색 */
[data-mode="cafe"] .tile .pr{color:var(--k-mut)}
[data-mode="cafe"] .tile{min-height:168px}
[data-mode="cafe"] .tile .art{max-width:80px}

/* 패스트푸드 — 큰 이미지, 굵은 제목, 노란 가격 배지 */
[data-mode="burger"] .tile{min-height:204px;padding:12px 8px 14px;gap:8px}
[data-mode="burger"] .tile .art{max-width:116px}
[data-mode="burger"] .tile .nm{font-family:var(--font-disp);font-size:15.5px;font-weight:400;letter-spacing:.01em}
[data-mode="burger"] .tile .pr{background:var(--accent);color:var(--accent-on);border-radius:5px;
  padding:4px 10px;font-weight:900;font-size:13.5px}
[data-mode="burger"] .tile .flag{background:var(--accent);color:var(--accent-on)}

/* 분식 — 한 화면에 많이, 이름을 크고 굵게 */
[data-mode="snack"] .tile{min-height:156px;padding:9px 6px 10px;gap:5px}
[data-mode="snack"] .tile .art{max-width:62px}
[data-mode="snack"] .tile .nm{font-family:var(--font-disp);font-size:15px;font-weight:400}
[data-mode="snack"] .tile .pr{font-size:13.5px;color:var(--brand);font-weight:800}
[data-mode="snack"] .tile .nm{margin-top:6px}
[data-mode="snack"] .tile .step,[data-mode="snack"] .tile .cnt{margin-top:auto}

/* 패스트푸드 좌측 세로 레일 */
.split{display:flex;min-height:100%}
.sidecat{flex:none;width:84px;background:var(--k-bg);border-right:1px solid var(--k-line)}
.sidecat button{width:100%;padding:17px 4px;font-size:12.5px;font-weight:700;color:var(--k-mut);
  border-bottom:1px solid var(--k-line);line-height:1.3;font-family:var(--font-k)}
.sidecat button[aria-pressed="true"]{background:var(--k-card);color:var(--brand);box-shadow:inset 4px 0 0 var(--brand)}

.step{display:flex;align-items:center;gap:0;margin-top:2px;border:1px solid var(--k-line);border-radius:5px;overflow:hidden}
.step button{width:26px;height:24px;font-size:14px;font-weight:900;background:#00000008;color:var(--k-fg)}
.step span{width:28px;text-align:center;font-size:12px;font-weight:700;font-variant-numeric:tabular-nums}

.modal{position:absolute;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet{width:100%;background:var(--k-card);border-radius:12px 12px 0 0;max-height:88%;overflow-y:auto;color:var(--k-fg)}
.sheet header{padding:13px 14px 10px;border-bottom:1px solid var(--k-line)}
.sheet header b{font-size:15px;display:block}
.sheet header small{font-size:11.5px;color:var(--k-mut);font-variant-numeric:tabular-nums}
.optgrp{padding:11px 14px;border-bottom:1px solid var(--k-line)}
.optgrp .lb{font-size:11px;font-weight:900;color:var(--k-mut);margin-bottom:7px;letter-spacing:.06em}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--k-line);border-radius:5px;padding:8px 11px;font-size:12px;font-weight:600;background:var(--k-card);color:var(--k-fg);font-variant-numeric:tabular-nums}
.chip[aria-pressed="true"]{border-color:var(--brand);background:var(--brand);color:var(--brand-on)}
.sheet footer{display:flex;gap:8px;padding:11px 14px calc(11px + env(safe-area-inset-bottom,0px))}
.sheet footer button{flex:1;padding:13px;border-radius:7px;font-size:13.5px;font-weight:800}
.btn-ghost{border:1px solid var(--k-line);color:var(--k-mut);background:var(--k-card)}
.btn-fill{background:var(--brand);color:var(--brand-on)}
.needopt{margin:0 14px 10px;background:#E05A4E16;border:1px solid #E05A4E66;color:#93362C;border-radius:6px;padding:8px 10px;font-size:11.5px;font-weight:700}

.upsell{align-items:center;padding:18px}
.upsell .sheet{border-radius:12px;max-width:340px;text-align:center}
.upsell .body{padding:20px 16px 6px}
.upsell .body .ico{font-size:40px}
.upsell .body b{display:block;font-size:16px;margin:9px 0 5px}
.upsell .body p{margin:0;font-size:12px;color:var(--k-mut);line-height:1.5}

.cartbar{position:sticky;bottom:0;z-index:6;background:var(--k-card);border-top:2px solid var(--brand);padding:9px 11px calc(9px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:9px}
.cartbar .info{flex:1;min-width:0}
.cartbar .info b{font-size:11.5px;display:block;color:var(--k-mut)}
.cartbar .info .tot{font-size:17px;font-weight:900;font-variant-numeric:tabular-nums;color:var(--k-fg)}
.cartbar .go{background:var(--brand);color:var(--brand-on);padding:13px 18px;border-radius:7px;font-size:14px;font-weight:900;flex:none}
.cartbar .go[disabled]{background:#C9C9C9;color:#fff}

.clist{padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.citem{background:var(--k-card);border:1px solid var(--k-line);border-radius:7px;padding:10px 11px;display:flex;gap:9px;align-items:flex-start}
.citem .cn{flex:1;min-width:0}
.citem .cn b{font-size:13px;display:block}
.citem .cn small{font-size:10.5px;color:var(--k-mut);line-height:1.45;display:block;margin-top:2px}
.citem .cp{font-size:13px;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.citem .del{font-size:11px;color:var(--k-mut);text-decoration:underline;padding:3px}
.sumline{display:flex;justify-content:space-between;font-size:13px;padding:11px 12px;border-top:1px dashed var(--k-line);font-variant-numeric:tabular-nums}
.sumline.big{font-size:17px;font-weight:900}

.pay{padding:16px 14px;display:flex;flex-direction:column;gap:9px;min-height:100%}
.pay h2{font-family:var(--font-disp);font-size:20px;text-align:center;margin:4px 0 2px}
.pay .amt{text-align:center;font-size:13px;color:var(--k-mut);margin-bottom:8px;font-variant-numeric:tabular-nums}
.pay .amt b{color:var(--accent-on);background:var(--accent);padding:2px 8px;border-radius:4px;font-size:16px}
.paybtn{background:var(--k-card);border:2px solid var(--k-line);border-radius:9px;padding:15px 14px;display:flex;align-items:center;gap:11px;color:var(--k-fg);text-align:left;width:100%}
.paybtn .ico{font-size:24px;flex:none}
.paybtn b{font-size:14px;display:block}
.paybtn small{font-size:10.5px;color:var(--k-mut);display:block}

.cardscr{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px 18px;text-align:center}
.cardscr h2{font-family:var(--font-disp);font-size:21px;margin:0}
.cardscr p{margin:0;font-size:12.5px;color:var(--k-mut);line-height:1.6}
.slot{width:170px;height:104px;border:2px dashed var(--k-line);border-radius:9px;position:relative;display:flex;align-items:flex-end;justify-content:center;padding-bottom:10px;background:#00000006}
.slot .mouth{width:120px;height:9px;background:var(--k-fg);border-radius:3px}
.plastic{position:absolute;top:8px;width:110px;height:68px;border-radius:6px;background:linear-gradient(135deg,var(--brand),var(--accent));box-shadow:0 5px 14px rgba(0,0,0,.25);animation:bob 1.6s ease-in-out infinite}
.plastic::after{content:"";position:absolute;left:10px;top:34px;width:26px;height:18px;border-radius:3px;background:rgba(255,255,255,.55)}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(7px)}}
.inserting .plastic{animation:insert .9s ease-in forwards}
@keyframes insert{to{transform:translateY(58px) scale(.9);opacity:.25}}
@media (prefers-reduced-motion:reduce){.plastic,.inserting .plastic{animation:none}}

.done{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;padding:22px 18px;text-align:center}
.done .check{width:52px;height:52px;border-radius:50%;background:var(--good);color:#fff;display:flex;align-items:center;justify-content:center;font-size:27px;margin-bottom:6px}
.done h2{font-family:var(--font-disp);font-size:20px;margin:0}
.done .num{font-family:var(--font-disp);font-size:52px;color:var(--brand);line-height:1.1;margin:6px 0;font-variant-numeric:tabular-nums}
.done p{margin:0;font-size:12px;color:var(--k-mut);line-height:1.6}
.verdict{margin-top:14px;width:100%;max-width:320px;border-radius:9px;padding:12px;font-size:12.5px;line-height:1.55;text-align:left;display:flex;gap:9px;align-items:flex-start}
.verdict.ok{background:#3FB57C1A;border:1px solid #3FB57C55;color:#1E6B47}
.verdict.no{background:#E05A4E14;border:1px solid #E05A4E55;color:#93362C}
.verdict .vi{font-size:17px;flex:none}
.done .again{margin-top:14px;background:var(--brand);color:var(--brand-on);padding:13px 22px;border-radius:7px;font-size:13.5px;font-weight:800}
.daybadge{margin-top:12px;background:var(--amber);color:#fff;font-size:11.5px;font-weight:900;padding:7px 13px;border-radius:999px}

.tover{position:absolute;inset:0;background:rgba(0,0,0,.72);z-index:40;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:20px;text-align:center;color:#fff}
.tover b{font-family:var(--font-disp);font-size:21px}
.tover p{margin:0;font-size:12.5px;opacity:.75;line-height:1.6}
.tover button{background:#fff;color:#111;padding:12px 22px;border-radius:7px;font-weight:800;font-size:13px}

.hintpulse{position:relative;z-index:9;animation:pulse 1.25s ease-in-out infinite;border-radius:7px}
@keyframes pulse{
  0%,100%{box-shadow:0 0 0 0 rgba(240,166,60,.95),0 0 0 0 rgba(240,166,60,.5)}
  50%{box-shadow:0 0 0 4px rgba(240,166,60,.95),0 0 0 11px rgba(240,166,60,0)}
}
@media (prefers-reduced-motion:reduce){.hintpulse{animation:none;box-shadow:0 0 0 4px rgba(240,166,60,.95)}}

.paybtn .ico.ic svg{width:26px;height:26px;color:var(--brand)}
.paybtn .ico.art2 svg,.serve button .ico svg{width:100%;height:100%;display:block}
.paybtn .ico.art2{width:38px;height:38px;flex:none}
.serve button .ico{width:46px;height:46px;color:var(--brand)}
.upsell .body .ico.art2{width:62px;height:62px;margin:0 auto}
.upsell .body .ico.art2 svg{width:100%;height:100%;display:block}
.streak .fire{display:inline-flex;width:14px;height:14px}
.streak .fire svg{width:100%;height:100%}
.device{font-family:var(--font-k)}
.kbar .kname,.attract h1,.serve h2,.pay h2,.cardscr h2,.done h2{font-family:var(--font-disp)}
.done .num{font-family:var(--font-disp)}
.note{padding:10px 12px;font-size:10.5px;color:var(--k-mut);line-height:1.5;border-top:1px solid var(--k-line);background:#00000005}

/* ===== 모바일 뱅킹 ===== */
/* --u : 글자·여백 단위. 「큰글」을 켜면 전체가 같은 비율로 커집니다. */
.bapp{--u:1px;min-height:100%;display:flex;flex-direction:column;background:var(--k-bg);color:var(--k-fg)}
.bapp[data-big="1"]{--u:1.17px}

.bnotice{flex:none;display:flex;align-items:center;gap:calc(var(--u)*7);background:#1E252C;color:#DCE3EA;
  padding:calc(var(--u)*7) calc(var(--u)*13);font-size:calc(var(--u)*12.5);
  font-weight:700;line-height:1.35;position:sticky;top:0;z-index:12}
.bnotice svg{flex:none;width:calc(var(--u)*16);height:calc(var(--u)*16)}

.bhead{flex:none;display:flex;align-items:center;gap:calc(var(--u)*8);background:var(--k-card);
  border-bottom:1px solid var(--k-line);padding:calc(var(--u)*11) calc(var(--u)*12);position:sticky;top:calc(var(--u)*32);z-index:10}
.bhead .bback{flex:none;width:calc(var(--u)*34);height:calc(var(--u)*34);display:flex;align-items:center;justify-content:center;color:var(--k-fg)}
.bhead .bback svg{width:calc(var(--u)*22);height:calc(var(--u)*22)}
.bhead .btitle{flex:1;min-width:0;font-size:calc(var(--u)*17);font-weight:800;letter-spacing:-.02em}
.bhead .btxt{flex:none;font-size:calc(var(--u)*13.5);font-weight:700;color:var(--k-mut);padding:calc(var(--u)*6)}

.bbody{flex:1;min-width:0;padding:calc(var(--u)*14) calc(var(--u)*13) calc(var(--u)*18);display:flex;flex-direction:column;gap:calc(var(--u)*12)}

/* 큰글 토글 + 알림/메뉴 */
.btoprow{display:flex;align-items:center;justify-content:space-between;gap:calc(var(--u)*10)}
.bbig{display:inline-flex;align-items:center;gap:calc(var(--u)*7);border:1px solid var(--k-line);background:var(--k-card);
  border-radius:999px;padding:calc(var(--u)*5) calc(var(--u)*11) calc(var(--u)*5) calc(var(--u)*13);
  font-size:calc(var(--u)*14);font-weight:800;color:var(--k-fg)}
.bbig i{width:calc(var(--u)*19);height:calc(var(--u)*19);border-radius:50%;background:var(--k-line);display:block;transition:background .15s}
.bbig[aria-pressed="true"] i{background:var(--brand)}
.btoprow .acts{display:flex;gap:calc(var(--u)*4)}
.btoprow .acts button{font-size:calc(var(--u)*14);font-weight:700;color:var(--k-fg);padding:calc(var(--u)*6) calc(var(--u)*8)}

.bgreet{font-size:calc(var(--u)*23);font-weight:800;letter-spacing:-.03em;margin:calc(var(--u)*2) 0 0;line-height:1.3}

/* 세그먼트 탭 */
.bseg{display:inline-flex;background:var(--k-card);border:1px solid var(--k-line);border-radius:999px;padding:calc(var(--u)*3);align-self:flex-start}
.bseg button{border-radius:999px;padding:calc(var(--u)*8) calc(var(--u)*18);font-size:calc(var(--u)*14.5);font-weight:800;color:var(--k-mut)}
.bseg button[aria-pressed="true"]{background:var(--brand);color:var(--brand-on)}

/* 계좌 카드 */
.bpanel{background:var(--k-card);border:1px solid var(--k-line);border-radius:calc(var(--u)*14);padding:calc(var(--u)*15)}
.bacc-top{display:flex;align-items:flex-start;gap:calc(var(--u)*10)}
.bbadge{flex:none;width:calc(var(--u)*34);height:calc(var(--u)*34);border-radius:50%;background:var(--brand);color:var(--brand-on);
  display:flex;align-items:center;justify-content:center;font-size:calc(var(--u)*13);font-weight:900;letter-spacing:-.04em}
.bacc-top .nmwrap{flex:1;min-width:0}
.bacc-top .nm{display:block;font-size:calc(var(--u)*16.5);font-weight:800;letter-spacing:-.02em;line-height:1.3}
.bacc-top .no{display:block;font-size:calc(var(--u)*13);color:var(--k-mut);font-variant-numeric:tabular-nums;margin-top:calc(var(--u)*2)}
.bacc-top .side{flex:none;text-align:right}
.bacc-top .side .pg{font-size:calc(var(--u)*13);color:var(--k-mut);font-variant-numeric:tabular-nums}
.bacc-top .side .mg{font-size:calc(var(--u)*13);font-weight:700;color:var(--brand);text-decoration:underline;margin-top:calc(var(--u)*4);display:block}

.bamtrow{display:flex;align-items:baseline;gap:calc(var(--u)*7);margin:calc(var(--u)*16) 0 calc(var(--u)*4);flex-wrap:wrap}
.bamtrow .v{font-size:calc(var(--u)*29);font-weight:900;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.bamtrow .v.hidden{letter-spacing:.06em;color:var(--k-mut)}
.bamtrow .w{font-size:calc(var(--u)*18);font-weight:800}
.bchip{align-self:center;border:1px solid var(--k-line);border-radius:999px;padding:calc(var(--u)*5) calc(var(--u)*12);
  font-size:calc(var(--u)*12.5);font-weight:700;color:var(--k-mut);background:var(--k-card);white-space:nowrap}

.bduo{display:grid;grid-template-columns:1fr 1.25fr;gap:calc(var(--u)*9);margin-top:calc(var(--u)*13)}
.bbtn{border-radius:calc(var(--u)*9);padding:calc(var(--u)*14) calc(var(--u)*8);font-size:calc(var(--u)*16);font-weight:800;
  letter-spacing:-.02em;text-align:center;min-height:calc(var(--u)*52)}
.bbtn.fill{background:var(--brand);color:var(--brand-on)}
.bbtn.line{border:1.5px solid var(--k-line);color:var(--k-fg);background:var(--k-card)}
.bbtn.wide{grid-column:1/-1}

/* 자주쓰는이체 */
.bfav{display:flex;gap:calc(var(--u)*7);align-items:center;flex-wrap:nowrap;overflow-x:auto;padding-bottom:calc(var(--u)*2)}
.bfav::-webkit-scrollbar{height:0}
.bfav .f{flex:none;border:1px solid var(--k-line);border-radius:999px;padding:calc(var(--u)*9) calc(var(--u)*16);
  font-size:calc(var(--u)*14.5);font-weight:700;color:var(--k-fg);background:var(--k-card)}
.bfav .set{flex:none;margin-left:auto;border:1.5px solid var(--brand);color:var(--brand);border-radius:999px;
  padding:calc(var(--u)*8) calc(var(--u)*12);font-size:calc(var(--u)*13);font-weight:800;
  display:inline-flex;align-items:center;gap:calc(var(--u)*5);background:var(--k-card)}
.bfav .set svg{width:calc(var(--u)*14);height:calc(var(--u)*14)}
.bfavcap{text-align:center;font-size:calc(var(--u)*13);color:var(--k-mut);margin:calc(var(--u)*11) 0 0;font-weight:600}

/* 큰 타일 2개 */
.btiles{display:grid;grid-template-columns:1fr 1fr;gap:calc(var(--u)*10)}
.btiles button{background:var(--k-card);border:1px solid var(--k-line);border-radius:calc(var(--u)*14);
  padding:calc(var(--u)*18) calc(var(--u)*10) calc(var(--u)*15);display:flex;flex-direction:column;align-items:center;
  gap:calc(var(--u)*11);color:var(--k-fg)}
.btiles button b{font-size:calc(var(--u)*15.5);font-weight:800;letter-spacing:-.02em}
.btiles svg{width:calc(var(--u)*46);height:calc(var(--u)*46)}

/* 안내 줄 */
.blink{display:flex;align-items:center;gap:calc(var(--u)*12);background:var(--k-card);border:1px solid var(--k-line);
  border-radius:calc(var(--u)*14);padding:calc(var(--u)*14);width:100%;text-align:left;color:var(--k-fg)}
.blink .ill{flex:none;width:calc(var(--u)*38);height:calc(var(--u)*38)}
.blink b{flex:1;min-width:0;font-size:calc(var(--u)*15.5);font-weight:700;letter-spacing:-.02em}
.blink .go{flex:none;font-size:calc(var(--u)*13);font-weight:700;color:var(--k-mut);text-decoration:underline}

/* 하단 탭 */
.btabs{flex:none;position:sticky;bottom:0;z-index:10;display:flex;background:var(--k-card);
  border-top:1px solid var(--k-line);padding-bottom:env(safe-area-inset-bottom,0px)}
.btabs button{flex:1;padding:calc(var(--u)*8) calc(var(--u)*2) calc(var(--u)*10);font-size:calc(var(--u)*11.5);
  font-weight:700;color:var(--k-mut);display:flex;flex-direction:column;align-items:center;gap:calc(var(--u)*3)}
.btabs svg{width:calc(var(--u)*22);height:calc(var(--u)*22)}
.btabs button.on{color:var(--brand)}

/* 전체메뉴 패널 */
.bmenupanel{position:absolute;inset:0;background:rgba(0,0,0,.45);z-index:30;display:flex;justify-content:flex-end}
.bmenupanel .inner{width:88%;max-width:340px;background:var(--k-card);height:100%;overflow-y:auto;padding-bottom:calc(var(--u)*24)}
.bmenupanel .mh{padding:calc(var(--u)*15);display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--k-line)}
.bmenupanel .mh b{font-size:calc(var(--u)*17);font-weight:800}
.bmenupanel .mh button{font-size:calc(var(--u)*20);font-weight:700;color:var(--k-mut);padding:calc(var(--u)*4) calc(var(--u)*8)}
.bmenugrp{padding:calc(var(--u)*13) calc(var(--u)*15);border-bottom:1px solid var(--k-line)}
.bmenugrp .gl{font-size:calc(var(--u)*12);font-weight:900;letter-spacing:.08em;color:var(--k-mut);margin-bottom:calc(var(--u)*9)}
.bmenugrp .gi{display:flex;flex-wrap:wrap;gap:calc(var(--u)*7)}
.bmenugrp .gi button{border:1px solid var(--k-line);border-radius:calc(var(--u)*8);padding:calc(var(--u)*10) calc(var(--u)*13);
  font-size:calc(var(--u)*14);font-weight:700;color:var(--k-fg);background:var(--k-card)}

/* 공통 줄·카드 */
.bk{display:flex;flex-direction:column;gap:calc(var(--u)*11)}
.bk h2{font-size:calc(var(--u)*20);font-weight:800;letter-spacing:-.03em;margin:0}
.bk .lead{margin:0;font-size:calc(var(--u)*13.5);color:var(--k-mut);line-height:1.6}
.bk .lead b{color:var(--k-fg)}
.brow{display:flex;align-items:center;gap:calc(var(--u)*12);width:100%;background:var(--k-card);border:1px solid var(--k-line);
  border-radius:calc(var(--u)*12);padding:calc(var(--u)*14);text-align:left;color:var(--k-fg);min-height:calc(var(--u)*64)}
.brow .bi{flex:none;width:calc(var(--u)*36);height:calc(var(--u)*36);border-radius:50%;background:#00000008;
  display:flex;align-items:center;justify-content:center;color:var(--brand)}
.brow .bi svg{width:calc(var(--u)*19);height:calc(var(--u)*19)}
.brow .bt{flex:1;min-width:0}
.brow .bt b{font-size:calc(var(--u)*16);font-weight:700;display:block;letter-spacing:-.02em}
.brow .bt small{font-size:calc(var(--u)*12.5);color:var(--k-mut);display:block;font-variant-numeric:tabular-nums;margin-top:calc(var(--u)*2)}
.brow .bv{flex:none;font-size:calc(var(--u)*15.5);font-weight:800;font-variant-numeric:tabular-nums}
.brow .bv.minus{color:var(--bad)}
.brow .bv.plus{color:var(--brand)}
.brow .bv.sm{font-size:calc(var(--u)*13);color:var(--brand);font-weight:700}

.bcard{background:var(--k-card);border:1px solid var(--k-line);border-radius:calc(var(--u)*12);padding:calc(var(--u)*6) calc(var(--u)*15)}
.bconf{display:flex;justify-content:space-between;gap:calc(var(--u)*12);padding:calc(var(--u)*11) 0;
  border-bottom:1px dashed var(--k-line);font-size:calc(var(--u)*14.5)}
.bconf:last-child{border-bottom:0}
.bconf span:first-child{color:var(--k-mut);flex:none}
.bconf span:last-child{font-weight:800;text-align:right;font-variant-numeric:tabular-nums;word-break:break-all}

/* 비밀번호 / 보안키패드 */
.bpin{display:flex;flex-direction:column;align-items:center;gap:calc(var(--u)*15);padding:calc(var(--u)*14) 0}
.bpin h2{text-align:center}
.bdots{display:flex;gap:calc(var(--u)*12)}
.bdots i{width:calc(var(--u)*15);height:calc(var(--u)*15);border-radius:50%;border:2px solid var(--brand);display:block}
.bdots i.f{background:var(--brand)}
.seckey{width:100%;max-width:calc(var(--u)*320)}
.seclab{font-size:calc(var(--u)*12);font-weight:800;color:var(--bad);text-align:center;margin-bottom:calc(var(--u)*8)}
.bkeys{display:grid;grid-template-columns:repeat(3,1fr);gap:calc(var(--u)*8);width:100%;max-width:calc(var(--u)*320);margin:0 auto}
.bkeys button{border:1px solid var(--k-line);background:var(--k-card);border-radius:calc(var(--u)*10);
  padding:calc(var(--u)*16) 0;font-size:calc(var(--u)*23);font-weight:700;color:var(--k-fg);font-variant-numeric:tabular-nums}
.bkeys button.sm{font-size:calc(var(--u)*13.5);font-weight:800;color:var(--k-mut)}

/* 금액 입력 */
.bamt{text-align:center;font-size:calc(var(--u)*31);font-weight:900;font-variant-numeric:tabular-nums;letter-spacing:-.04em;padding:calc(var(--u)*6) 0}
.bamt small{display:block;font-size:calc(var(--u)*12.5);font-weight:600;color:var(--k-mut);letter-spacing:0;margin-top:calc(var(--u)*3)}
.bquick{display:flex;gap:calc(var(--u)*6);flex-wrap:wrap;justify-content:center}
.bquick button{border:1px solid var(--k-line);background:var(--k-card);border-radius:999px;
  padding:calc(var(--u)*9) calc(var(--u)*14);font-size:calc(var(--u)*13.5);font-weight:700;color:var(--k-fg)}
.blimit{display:flex;justify-content:space-between;font-size:calc(var(--u)*12.5);color:var(--k-mut);
  padding:calc(var(--u)*2);font-variant-numeric:tabular-nums}

.bfield{display:flex;align-items:center;gap:calc(var(--u)*8);border:2px solid var(--k-line);border-radius:calc(var(--u)*10);
  padding:calc(var(--u)*3) calc(var(--u)*5) calc(var(--u)*3) calc(var(--u)*13);background:var(--k-card)}
.bfield input{flex:1;min-width:0;border:0;background:none;font:inherit;font-size:calc(var(--u)*17);font-weight:700;
  color:var(--k-fg);padding:calc(var(--u)*13) 0;outline:none;font-variant-numeric:tabular-nums}
.bfield button{flex:none;background:var(--brand);color:var(--brand-on);border-radius:calc(var(--u)*8);
  padding:calc(var(--u)*12) calc(var(--u)*16);font-size:calc(var(--u)*14.5);font-weight:800}
.bsmall{display:flex;align-items:center;gap:calc(var(--u)*9);border:1px solid var(--k-line);border-radius:calc(var(--u)*9);
  padding:calc(var(--u)*2) calc(var(--u)*5) calc(var(--u)*2) calc(var(--u)*12);background:var(--k-card)}
.bsmall label{flex:none;font-size:calc(var(--u)*13);font-weight:700;color:var(--k-mut);white-space:nowrap}
.bsmall input{flex:1;min-width:0;border:0;background:none;font:inherit;font-size:calc(var(--u)*15);font-weight:600;
  color:var(--k-fg);padding:calc(var(--u)*12) 0;outline:none}

/* 받는 분 탭 / 은행 격자 / 필터 */
.btoggle{display:flex;border:1px solid var(--k-line);border-radius:calc(var(--u)*10);overflow:hidden;background:var(--k-card)}
.btoggle button{flex:1;padding:calc(var(--u)*12) calc(var(--u)*4);font-size:calc(var(--u)*14);font-weight:700;color:var(--k-mut)}
.btoggle button[aria-pressed="true"]{background:var(--brand);color:var(--brand-on)}
.bbanks{display:grid;grid-template-columns:repeat(3,1fr);gap:calc(var(--u)*8)}
.bbanks button{border:1px solid var(--k-line);background:var(--k-card);border-radius:calc(var(--u)*10);
  padding:calc(var(--u)*15) calc(var(--u)*4);font-size:calc(var(--u)*13);font-weight:700;color:var(--k-fg);
  min-height:calc(var(--u)*72);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:calc(var(--u)*7)}
.bbanks button .lg{width:calc(var(--u)*28);height:calc(var(--u)*28);border-radius:50%;background:#00000010;
  display:flex;align-items:center;justify-content:center;font-size:calc(var(--u)*13);font-weight:900;color:var(--k-mut)}
.bbanks button[aria-pressed="true"]{border-color:var(--brand);box-shadow:inset 0 0 0 1px var(--brand)}
.bfilters{display:flex;gap:calc(var(--u)*6);overflow-x:auto;padding-bottom:calc(var(--u)*3)}
.bfilters::-webkit-scrollbar{height:0}
.bfilters button{flex:none;border:1px solid var(--k-line);background:var(--k-card);border-radius:999px;
  padding:calc(var(--u)*8) calc(var(--u)*14);font-size:calc(var(--u)*13);font-weight:700;color:var(--k-mut)}
.bfilters button[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:var(--brand-on)}

/* 경고 / 전화 / ARS / 영수증 */
.bwarn{background:#E05A4E12;border:1.5px solid #E05A4E66;border-radius:calc(var(--u)*11);padding:calc(var(--u)*13);
  font-size:calc(var(--u)*13.5);color:#93362C;font-weight:700;line-height:1.6}
.bcall{background:var(--k-fg);color:#fff;border-radius:calc(var(--u)*13);padding:calc(var(--u)*18) calc(var(--u)*15);text-align:center}
.bcall .who{font-size:calc(var(--u)*13);opacity:.7}
.bcall b{display:block;font-size:calc(var(--u)*18);margin:calc(var(--u)*5) 0 calc(var(--u)*9)}
.bcall q{display:block;font-size:calc(var(--u)*14);line-height:1.65;opacity:.9;font-style:normal}
.bars{text-align:center;display:flex;flex-direction:column;align-items:center;gap:calc(var(--u)*13)}
.bars .code{font-family:var(--font-disp);font-size:calc(var(--u)*46);letter-spacing:.15em;color:var(--brand);font-variant-numeric:tabular-nums}
.bars .ring{width:calc(var(--u)*56);height:calc(var(--u)*56);border-radius:50%;background:#1C6B3C18;color:var(--brand);
  display:flex;align-items:center;justify-content:center}
.bars .ring svg{width:calc(var(--u)*26);height:calc(var(--u)*26)}
.bfill{background:var(--brand);color:var(--brand-on);border-radius:calc(var(--u)*10);padding:calc(var(--u)*15);
  font-size:calc(var(--u)*16);font-weight:800;width:100%;min-height:calc(var(--u)*54)}
.bghost{border:1.5px solid var(--k-line);color:var(--k-mut);background:var(--k-card);border-radius:calc(var(--u)*10);
  padding:calc(var(--u)*15);font-size:calc(var(--u)*16);font-weight:800;width:100%;min-height:calc(var(--u)*54)}
.breceipt{background:var(--k-card);border:1px solid var(--k-line);border-radius:calc(var(--u)*12);
  padding:calc(var(--u)*4) calc(var(--u)*15);width:100%;max-width:340px;text-align:left}
.btips{display:flex;flex-direction:column;gap:calc(var(--u)*10)}
.btip{background:var(--k-card);border:1px solid var(--k-line);border-left:3px solid var(--brand);
  border-radius:0 calc(var(--u)*12) calc(var(--u)*12) 0;padding:calc(var(--u)*14)}
.btip b{display:block;font-size:calc(var(--u)*15.5);font-weight:800;margin-bottom:calc(var(--u)*5)}
.btip p{margin:0;font-size:calc(var(--u)*13.5);color:var(--k-mut);line-height:1.6}

/* ===== 기차 예매 ===== */
/* 홈 — 파란 그라데이션 머리 + 흰 검색 카드 */
.thead{flex:none;padding:calc(var(--u)*12) calc(var(--u)*14) calc(var(--u)*16);
  background:linear-gradient(180deg,#2E7CF2 0%,#2170E8 44%,#8FBCF9 80%,var(--k-bg) 100%)}
.thtop{display:flex;align-items:center;gap:calc(var(--u)*8);color:#fff}
.thtop .wm{flex:1;min-width:0;font-family:var(--font-disp);font-size:calc(var(--u)*20);font-weight:900;
  letter-spacing:-.04em;color:#fff}
.thbig{flex:none;border:1.5px solid rgba(255,255,255,.85);border-radius:999px;color:#fff;
  padding:calc(var(--u)*6) calc(var(--u)*13);font-size:calc(var(--u)*13.5);font-weight:800;white-space:nowrap}
.thbig[aria-pressed="true"]{background:#fff;color:var(--brand)}
.thico{flex:none;width:calc(var(--u)*32);height:calc(var(--u)*32);display:flex;align-items:center;justify-content:center;color:#fff}
.thico svg{width:calc(var(--u)*21);height:calc(var(--u)*21)}
.thq{color:#fff;font-size:calc(var(--u)*25);font-weight:900;letter-spacing:-.045em;
  margin:calc(var(--u)*16) 0 calc(var(--u)*14);line-height:1.25}

.tsearch{background:var(--k-card);border-radius:calc(var(--u)*16);overflow:hidden;
  box-shadow:0 calc(var(--u)*6) calc(var(--u)*18) rgba(14,50,110,.16)}
.tsearch .inner{padding:calc(var(--u)*16) calc(var(--u)*14) calc(var(--u)*14)}
.tod{display:flex;align-items:center;gap:calc(var(--u)*6)}
.tod .st{flex:1;min-width:0;text-align:center;padding:calc(var(--u)*4) 0}
.tod .st small{display:block;font-size:calc(var(--u)*13);color:var(--k-mut);font-weight:600}
.tod .st b{display:block;font-size:calc(var(--u)*25);font-weight:900;letter-spacing:-.045em;
  margin-top:calc(var(--u)*4);line-height:1.15}
.tod .st b i{font-style:normal;font-size:calc(var(--u)*15);color:var(--k-mut);margin-left:calc(var(--u)*4)}
.tod .swap{flex:none;width:calc(var(--u)*46);height:calc(var(--u)*46);border-radius:50%;
  background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center}
.tod .swap svg{width:calc(var(--u)*23);height:calc(var(--u)*23)}

.tfield{display:flex;align-items:center;gap:calc(var(--u)*12);width:100%;background:var(--k-bg);
  border-radius:calc(var(--u)*11);padding:calc(var(--u)*14);margin-top:calc(var(--u)*11);
  color:var(--k-fg);text-align:left;min-height:calc(var(--u)*54)}
.tfield .fl{flex:none;font-size:calc(var(--u)*13.5);color:var(--k-mut);font-weight:600}
.tfield .fv{flex:1;min-width:0;text-align:center;font-size:calc(var(--u)*16.5);font-weight:800;letter-spacing:-.02em}
.tfield2{display:grid;grid-template-columns:1fr 1fr;gap:calc(var(--u)*9);margin-top:calc(var(--u)*9)}
.tfield2 .tfield{margin-top:0}
.tfield2 .tfield .fv{font-size:calc(var(--u)*15.5)}
.tcta{display:grid;grid-template-columns:1fr 1fr;background:var(--brand)}
.tcta button{padding:calc(var(--u)*17) 0;font-size:calc(var(--u)*17);font-weight:800;color:#fff;letter-spacing:-.02em}
.tcta button+button{box-shadow:inset 1px 0 0 rgba(255,255,255,.3)}

/* 홈 하단 카드들 */
.tbanner{background:linear-gradient(90deg,#DCEAFE,#EEF4FF);border-radius:calc(var(--u)*12);
  padding:calc(var(--u)*14);text-align:center;font-size:calc(var(--u)*15);font-weight:900;
  color:#17418A;letter-spacing:-.02em}
.tquick3{display:grid;grid-template-columns:repeat(3,1fr);background:var(--k-card);
  border:1px solid var(--k-line);border-radius:calc(var(--u)*14);padding:calc(var(--u)*14) 0}
.tquick3 button{display:flex;flex-direction:column;align-items:center;gap:calc(var(--u)*8);color:var(--k-fg)}
.tquick3 button .ic{width:calc(var(--u)*32);height:calc(var(--u)*32);color:var(--brand)}
.tquick3 button .ic svg{width:100%;height:100%}
.tquick3 button b{font-size:calc(var(--u)*14);font-weight:700}
.tgrid4{display:grid;grid-template-columns:repeat(4,1fr);gap:calc(var(--u)*12) calc(var(--u)*4);
  background:var(--k-card);border:1px solid var(--k-line);border-radius:calc(var(--u)*14);padding:calc(var(--u)*16) calc(var(--u)*8)}
.tgrid4 button{display:flex;flex-direction:column;align-items:center;gap:calc(var(--u)*7);color:var(--k-fg)}
.tgrid4 button .ic{width:calc(var(--u)*28);height:calc(var(--u)*28);color:var(--brand)}
.tgrid4 button .ic svg{width:100%;height:100%}
.tgrid4 button b{font-size:calc(var(--u)*12.5);font-weight:700;word-break:keep-all;text-align:center}

/* 열차 조회 결과 — 파란 머리 */
.tlhead{flex:none;background:var(--brand);padding:calc(var(--u)*10) calc(var(--u)*12) calc(var(--u)*12)}
.tlh1{display:flex;align-items:center;gap:calc(var(--u)*8);color:#fff}
.tlh1 .bk{flex:none;width:calc(var(--u)*32);height:calc(var(--u)*32);display:flex;align-items:center;justify-content:center;color:#fff}
.tlh1 .bk svg{width:calc(var(--u)*22);height:calc(var(--u)*22)}
.tlh1 .rt{flex:1;min-width:0}
.tlh1 .rt b{display:flex;align-items:center;gap:calc(var(--u)*7);font-size:calc(var(--u)*20);font-weight:900;letter-spacing:-.035em}
.tlh1 .rt b svg{width:calc(var(--u)*18);height:calc(var(--u)*18);opacity:.9}
.tlh1 .rt small{display:block;font-size:calc(var(--u)*12.5);opacity:.85;margin-top:calc(var(--u)*2)}
.tlh1 .edit{flex:none;border:1.3px solid rgba(255,255,255,.8);border-radius:999px;color:#fff;
  padding:calc(var(--u)*6) calc(var(--u)*13);font-size:calc(var(--u)*13);font-weight:800}
.tdatebar{display:flex;align-items:center;gap:calc(var(--u)*4);background:rgba(255,255,255,.18);
  border-radius:999px;padding:calc(var(--u)*4);margin-top:calc(var(--u)*11)}
.tdatebar .nav{flex:none;width:calc(var(--u)*36);height:calc(var(--u)*36);border-radius:50%;
  display:flex;align-items:center;justify-content:center;color:#fff}
.tdatebar .nav svg{width:calc(var(--u)*19);height:calc(var(--u)*19)}
.tdatebar .nav[disabled]{opacity:.35}
.tdatebar .lbl{flex:1;min-width:0;text-align:center;color:#fff;font-size:calc(var(--u)*14.5);font-weight:800;
  letter-spacing:-.02em;padding:calc(var(--u)*6) 0}
.tfilters{display:flex;gap:calc(var(--u)*7);margin-top:calc(var(--u)*10);overflow-x:auto}
.tfilters::-webkit-scrollbar{height:0}
.tfilters button{flex:1;min-width:calc(var(--u)*92);background:rgba(255,255,255,.18);border-radius:calc(var(--u)*9);
  color:#fff;padding:calc(var(--u)*11) calc(var(--u)*10);font-size:calc(var(--u)*13.5);font-weight:700;
  display:flex;align-items:center;justify-content:space-between;gap:calc(var(--u)*6)}
.tfilters button svg{width:calc(var(--u)*14);height:calc(var(--u)*14);flex:none;opacity:.9}

.tsortrow{flex:none;display:flex;align-items:center;justify-content:space-between;gap:calc(var(--u)*10);
  background:var(--k-card);padding:calc(var(--u)*13) calc(var(--u)*14);border-bottom:1px solid var(--k-line)}
.tsortrow .s{display:inline-flex;align-items:center;gap:calc(var(--u)*6);font-size:calc(var(--u)*15);font-weight:800}
.tsortrow .s svg{width:calc(var(--u)*17);height:calc(var(--u)*17)}
.tsortrow .k{font-size:calc(var(--u)*12);color:var(--k-mut);text-align:right;line-height:1.4}

/* 열차 한 줄 */
.trow{display:block;width:100%;background:var(--k-card);border-bottom:1px solid var(--k-line);
  padding:calc(var(--u)*15) calc(var(--u)*14);text-align:left;color:var(--k-fg)}
.trow.out{background:var(--k-bg)}
.trow .tt{display:flex;align-items:center;gap:calc(var(--u)*8);margin-bottom:calc(var(--u)*11)}
.trow .kind{flex:none;font-size:calc(var(--u)*12);font-weight:900;border-radius:calc(var(--u)*5);
  padding:calc(var(--u)*4) calc(var(--u)*9);background:var(--brand);color:#fff;letter-spacing:.01em}
.trow .kind.slow{background:#5C6B80}
.trow .no{font-size:calc(var(--u)*13);color:var(--k-mut);font-weight:600}
.trow .body{display:flex;align-items:flex-start;gap:calc(var(--u)*10)}
.trow .left{flex:1;min-width:0}
.trow .tline{display:flex;align-items:center;gap:calc(var(--u)*9)}
.trow .tx{text-align:left}
.trow .tx b{display:block;font-size:calc(var(--u)*23);font-weight:900;font-variant-numeric:tabular-nums;letter-spacing:-.04em;line-height:1.1}
.trow .tx small{display:block;font-size:calc(var(--u)*12.5);color:var(--k-mut);margin-top:calc(var(--u)*2)}
.trow .tline .ar{color:var(--k-mut);flex:none}
.trow .tline .ar svg{width:calc(var(--u)*20);height:calc(var(--u)*20);display:block}
.trow .durchip{display:inline-block;background:var(--k-bg);border-radius:calc(var(--u)*6);
  padding:calc(var(--u)*5) calc(var(--u)*9);font-size:calc(var(--u)*12);color:var(--k-mut);
  font-weight:600;margin-top:calc(var(--u)*9)}
.trow .cls{flex:none;width:calc(var(--u)*126);border-left:1px solid var(--k-line);padding-left:calc(var(--u)*11)}
.trow .cl{display:flex;align-items:center;justify-content:space-between;gap:calc(var(--u)*6);padding:calc(var(--u)*5) 0}
.trow .cl .nm{font-size:calc(var(--u)*12.5);color:var(--k-mut);font-weight:600;flex:none}
.trow .cl .vl{font-size:calc(var(--u)*14);font-weight:900;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.trow .cl .vl.sold{color:#D33A2C}
.trow .cl .vl.ok{color:var(--brand)}
.trow .cl .was{display:block;font-size:calc(var(--u)*11.5);color:var(--k-mut);text-decoration:line-through;font-weight:600}
.trow .cl.sel{background:color-mix(in srgb,var(--brand) 9%,transparent);border-radius:calc(var(--u)*6);
  padding-left:calc(var(--u)*6);padding-right:calc(var(--u)*6);margin-left:calc(var(--u)*-6)}
.tmore{text-align:center;padding:calc(var(--u)*22) calc(var(--u)*14) calc(var(--u)*10)}
.tmore p{margin:0 0 calc(var(--u)*12);font-size:calc(var(--u)*15);font-weight:700;color:var(--k-fg)}
.tmore button{border:1.3px solid var(--k-line);border-radius:999px;background:var(--k-card);
  color:var(--brand);padding:calc(var(--u)*12) calc(var(--u)*20);font-size:calc(var(--u)*14.5);font-weight:800}

/* 전체메뉴 페이지 */
.tmenutop{display:grid;grid-template-columns:1fr 1fr;background:var(--k-card);border:1px solid var(--k-line);
  border-radius:calc(var(--u)*14)}
.tmenutop>div{padding:calc(var(--u)*15)}
.tmenutop>div+div{border-left:1px solid var(--k-line)}
.tmenutop .lb{font-size:calc(var(--u)*13.5);color:var(--k-mut);font-weight:700}
.tmenutop .vv{font-size:calc(var(--u)*22);font-weight:900;font-variant-numeric:tabular-nums;margin-top:calc(var(--u)*5)}
.tsvc{background:var(--k-card);border:1px solid var(--k-line);border-radius:calc(var(--u)*14);padding:calc(var(--u)*15)}
.tsvc .hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:calc(var(--u)*13)}
.tsvc .hd b{font-size:calc(var(--u)*16.5);font-weight:800}
.tsvc .hd span{font-size:calc(var(--u)*13);color:var(--k-mut);font-weight:600}
.tsvc .gi{display:grid;grid-template-columns:1fr 1fr;gap:calc(var(--u)*14) calc(var(--u)*10)}
.tsvc .gi button{display:flex;align-items:center;gap:calc(var(--u)*10);color:var(--k-fg);text-align:left}
.tsvc .gi button .ic{flex:none;width:calc(var(--u)*28);height:calc(var(--u)*28);color:var(--brand)}
.tsvc .gi button .ic svg{width:100%;height:100%}
.tsvc .gi button b{font-size:calc(var(--u)*14.5);font-weight:700}
.tsec{font-size:calc(var(--u)*20);font-weight:900;letter-spacing:-.03em;margin:calc(var(--u)*6) 0 0}
.tlist{background:var(--k-card);border:1px solid var(--k-line);border-radius:calc(var(--u)*14);overflow:hidden}
.tlist button{display:flex;align-items:center;gap:calc(var(--u)*10);width:100%;padding:calc(var(--u)*16) calc(var(--u)*15);
  color:var(--k-fg);text-align:left;border-bottom:1px solid var(--k-line)}
.tlist button:last-child{border-bottom:0}
.tlist button b{flex:1;min-width:0;font-size:calc(var(--u)*15.5);font-weight:700}
.tlist button small{flex:none;font-size:calc(var(--u)*12.5);color:var(--k-mut)}
.tlist button .cv{flex:none;width:calc(var(--u)*17);height:calc(var(--u)*17);color:var(--k-mut)}
.tlist button .cv svg{width:100%;height:100%}

/* 승객 / 날짜 / 좌석 — 이전과 동일 계열 */
.tdates{display:flex;gap:calc(var(--u)*7);overflow-x:auto;padding-bottom:calc(var(--u)*4)}
.tdates::-webkit-scrollbar{height:0}
.tdates button{flex:none;border:1px solid var(--k-line);background:var(--k-card);border-radius:calc(var(--u)*10);
  padding:calc(var(--u)*10) calc(var(--u)*13);text-align:center;color:var(--k-fg);min-width:calc(var(--u)*62)}
.tdates button .d{display:block;font-size:calc(var(--u)*18);font-weight:900;font-variant-numeric:tabular-nums}
.tdates button .w{display:block;font-size:calc(var(--u)*11.5);color:var(--k-mut);margin-top:calc(var(--u)*2)}
.tdates button[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:#fff}
.tdates button[aria-pressed="true"] .w{color:#fff;opacity:.85}
.thours{display:grid;grid-template-columns:repeat(4,1fr);gap:calc(var(--u)*7)}
.thours button{border:1px solid var(--k-line);background:var(--k-card);border-radius:calc(var(--u)*9);
  padding:calc(var(--u)*12) 0;font-size:calc(var(--u)*14);font-weight:700;color:var(--k-fg);font-variant-numeric:tabular-nums}
.thours button[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:#fff}
.tregion{display:flex;gap:calc(var(--u)*6);overflow-x:auto;padding-bottom:calc(var(--u)*3)}
.tregion::-webkit-scrollbar{height:0}
.tregion button{flex:none;border:1px solid var(--k-line);background:var(--k-card);border-radius:999px;
  padding:calc(var(--u)*9) calc(var(--u)*15);font-size:calc(var(--u)*13.5);font-weight:700;color:var(--k-mut)}
.tregion button[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:#fff}
.tstations{display:grid;grid-template-columns:repeat(3,1fr);gap:calc(var(--u)*8)}
.tstations button{border:1px solid var(--k-line);background:var(--k-card);border-radius:calc(var(--u)*10);
  padding:calc(var(--u)*15) calc(var(--u)*4);font-size:calc(var(--u)*14.5);font-weight:700;color:var(--k-fg);
  min-height:calc(var(--u)*56)}
.tstations button[aria-pressed="true"]{border-color:var(--brand);color:var(--brand);box-shadow:inset 0 0 0 1px var(--brand)}
.tpaxrow{display:flex;align-items:center;gap:calc(var(--u)*12);padding:calc(var(--u)*13) 0;border-bottom:1px solid var(--k-line)}
.tpaxrow:last-child{border-bottom:0}
.tpaxrow .lb{flex:1;min-width:0}
.tpaxrow .lb b{display:block;font-size:calc(var(--u)*16);font-weight:700}
.tpaxrow .lb small{display:block;font-size:calc(var(--u)*12);color:var(--k-mut);margin-top:calc(var(--u)*2)}
.tstep{display:flex;align-items:center;gap:calc(var(--u)*4);flex:none}
.tstep button{width:calc(var(--u)*40);height:calc(var(--u)*40);border-radius:50%;border:1px solid var(--k-line);
  background:var(--k-card);font-size:calc(var(--u)*20);font-weight:800;color:var(--k-fg);display:flex;align-items:center;justify-content:center}
.tstep button:disabled{opacity:.35}
.tstep span{width:calc(var(--u)*34);text-align:center;font-size:calc(var(--u)*18);font-weight:900;font-variant-numeric:tabular-nums}
.tcar{display:flex;align-items:center;justify-content:space-between;gap:calc(var(--u)*8);
  background:var(--k-card);border:1px solid var(--k-line);border-radius:calc(var(--u)*10);padding:calc(var(--u)*11) calc(var(--u)*14)}
.tcar b{font-size:calc(var(--u)*15);font-weight:800}
.tseatmap{background:var(--k-card);border:1px solid var(--k-line);border-radius:calc(var(--u)*12);padding:calc(var(--u)*14)}
.tseathdr,.tseatrow{display:grid;grid-template-columns:repeat(2,1fr) calc(var(--u)*26) repeat(2,1fr);gap:calc(var(--u)*6)}
.tseathdr{font-size:calc(var(--u)*11.5);font-weight:800;color:var(--k-mut);text-align:center;margin-bottom:calc(var(--u)*7)}
.tseatrow{margin-bottom:calc(var(--u)*6);align-items:center}
.tseat{border:1px solid var(--k-line);background:var(--k-card);border-radius:calc(var(--u)*7);
  padding:calc(var(--u)*11) 0;font-size:calc(var(--u)*12.5);font-weight:700;color:var(--k-fg);font-variant-numeric:tabular-nums}
.tseat.win{border-color:var(--brand);color:var(--brand)}
.tseat.taken{background:var(--k-bg);color:#AEB6C0;border-style:dashed}
.tseat[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:#fff}
.taisle{font-size:calc(var(--u)*10.5);color:var(--k-mut);text-align:center}
.tlegend{display:flex;gap:calc(var(--u)*12);flex-wrap:wrap;font-size:calc(var(--u)*12);color:var(--k-mut);margin-top:calc(var(--u)*9)}
.tlegend span{display:inline-flex;align-items:center;gap:calc(var(--u)*5)}
.tlegend i{width:calc(var(--u)*13);height:calc(var(--u)*13);border-radius:calc(var(--u)*4);display:block;border:1px solid var(--k-line)}
.tlegend i.w{border-color:var(--brand)}
.tlegend i.t{background:var(--k-bg);border-style:dashed}
.tlegend i.s{background:var(--brand);border-color:var(--brand)}

/* 결제 제한시간 · 승차권 */
.thold{background:#2A1416;border:1.5px solid #8A3A33;border-radius:calc(var(--u)*12);
  padding:calc(var(--u)*15);text-align:center;color:#FFD9D4}
.thold .lbl{font-size:calc(var(--u)*13);font-weight:700;opacity:.85}
.thold .clk{font-family:var(--font-disp);font-size:calc(var(--u)*40);font-variant-numeric:tabular-nums;
  letter-spacing:.04em;margin:calc(var(--u)*4) 0;color:#FF9C90}
.thold p{margin:0;font-size:calc(var(--u)*12.5);line-height:1.6;opacity:.9}
.tticket{background:var(--brand);color:#fff;border-radius:calc(var(--u)*14);padding:calc(var(--u)*17);overflow:hidden}
.tticket .tnm{font-size:calc(var(--u)*12.5);opacity:.82;font-weight:700}
.tticket .trt{display:flex;align-items:center;gap:calc(var(--u)*10);margin:calc(var(--u)*8) 0 calc(var(--u)*3)}
.tticket .trt b{font-size:calc(var(--u)*25);font-weight:900;letter-spacing:-.03em}
.tticket .trt svg{width:calc(var(--u)*20);height:calc(var(--u)*20);opacity:.85}
.tticket .tmeta{font-size:calc(var(--u)*13.5);opacity:.92;font-variant-numeric:tabular-nums;line-height:1.65}
.tperf{border-top:1px dashed rgba(255,255,255,.4);margin-top:calc(var(--u)*13);padding-top:calc(var(--u)*13);
  display:flex;align-items:center;gap:calc(var(--u)*13)}
.tqr{flex:none;width:calc(var(--u)*74);height:calc(var(--u)*74);background:#fff;border-radius:calc(var(--u)*8);padding:calc(var(--u)*6)}
.tqr svg{width:100%;height:100%;display:block}
.tperf .pn{flex:1;min-width:0;font-size:calc(var(--u)*12.5);opacity:.92;line-height:1.6}

/* ===== 로비 ===== */
[data-mode="lobby"]{
  --brand:#1A3D7C; --brand-on:#FFFFFF;
  --stamp:#C2182B; --ok2:#2B7A52;
  --k-bg:#EDEFF2; --k-card:#FFFFFF; --k-line:#E4E7EC; --k-line2:#D4D9E0;
  --ink:#1A1D23; --k-fg:#1A1D23; --k-mut:#6B737F;
  --font-k:'Noto Sans KR',sans-serif;
  --font-disp:'Do Hyeon','Noto Sans KR',sans-serif;
  --lu:1px;
}
[data-mode="lobby"][data-big="1"]{--lu:1.35px}
.lobby{min-height:100%;background:var(--k-bg);color:var(--k-fg);font-family:var(--font-k);
  display:flex;flex-direction:column;position:relative}

/* 머리 — 인사와 오늘 할 일을 한 덩어리로 */
.lbhead{background:var(--brand);color:#fff;padding:calc(var(--lu)*16) calc(var(--lu)*16) calc(var(--lu)*18)}
.lbhead .row{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:calc(var(--lu)*10)}
.lbhead .tagx{font-size:calc(var(--lu)*12.5);font-weight:700;letter-spacing:.02em;opacity:.88}
.lbbrand{display:flex;align-items:center;gap:calc(var(--lu)*9);min-width:0}
.lbbrand img{display:block;flex:none;width:calc(var(--lu)*48);height:calc(var(--lu)*42);object-fit:contain;
  padding:3px;border-radius:8px;background:#fff}
.lbbrand img.wide{width:calc(var(--lu)*96)}
.lbbrand .tagx{display:block;min-width:0;line-height:1.25;font-size:calc(var(--lu)*14);opacity:1}
.lbbrand .tagx small{display:block;font-size:calc(var(--lu)*12);font-weight:700;color:#E1ECFF}
.lbbigbtn{flex:none;background:rgba(255,255,255,.14);color:#fff;border:1.5px solid rgba(255,255,255,.55);
  border-radius:999px;padding:calc(var(--lu)*11) calc(var(--lu)*17);font-size:calc(var(--lu)*13.5);
  font-weight:700;white-space:nowrap;min-height:calc(var(--lu)*46)}
.lbbigbtn[aria-pressed="true"]{background:#fff;color:var(--brand);border-color:#fff;font-weight:800}
.lbhead .dt{font-size:calc(var(--lu)*13);font-weight:600;opacity:.85;margin-top:calc(var(--lu)*14);
  font-variant-numeric:tabular-nums}
.lbhead h1{font-family:var(--font-disp);font-size:calc(var(--lu)*28);line-height:1.15;letter-spacing:-.02em;
  margin:calc(var(--lu)*4) 0 calc(var(--lu)*18);font-weight:400}

/* 오늘 할 일 — 화면에서 단 하나뿐인 그림자 */
.lbcta{display:flex;align-items:center;gap:calc(var(--lu)*13);width:100%;text-align:left;
  background:#fff;color:var(--ink);border-radius:calc(var(--lu)*12);
  padding:calc(var(--lu)*15) calc(var(--lu)*16);min-height:calc(var(--lu)*76);
  box-shadow:0 calc(var(--lu)*4) calc(var(--lu)*14) rgba(8,22,50,.28)}
.lbcta .pl{flex:none;width:calc(var(--lu)*44);height:calc(var(--lu)*44);border-radius:50%;
  background:var(--stamp);color:#fff;display:flex;align-items:center;justify-content:center}
.lbcta .pl svg{width:calc(var(--lu)*20);height:calc(var(--lu)*20)}
.lbcta .tx{flex:1;min-width:0}
.lbcta .tx b{display:block;font-size:calc(var(--lu)*19);font-weight:800;letter-spacing:-.025em}
.lbcta .tx small{display:block;font-size:calc(var(--lu)*13.5);color:var(--k-mut);margin-top:calc(var(--lu)*4);font-weight:600}
.lbcta .cv{flex:none;width:calc(var(--lu)*20);height:calc(var(--lu)*20);color:var(--k-mut)}
.lbcta .cv svg{width:100%;height:100%}
.lbcta.alldone .pl{background:var(--ok2)}

/* 섹션 — 테두리 없이 흰 블록과 회색 여백으로만 구분 */
.lbsection{background:var(--k-card);padding:calc(var(--lu)*16) calc(var(--lu)*16) calc(var(--lu)*6)}
.lbsection+.lbsection{margin-top:calc(var(--lu)*12)}
.lbhead+.lbsection{margin-top:calc(var(--lu)*12)}
.lbsec{display:flex;align-items:baseline;justify-content:space-between;gap:10px;
  padding-bottom:calc(var(--lu)*13);border-bottom:1px solid var(--k-line)}
.lbsec h2{margin:0;font-size:calc(var(--lu)*18);font-weight:800;letter-spacing:-.025em}
.lbsec span{font-size:calc(var(--lu)*13);font-weight:700;color:var(--k-mut);font-variant-numeric:tabular-nums}

/* 출석부 */
.lbgrid{display:grid;grid-template-columns:repeat(7,1fr);padding:calc(var(--lu)*14) 0 calc(var(--lu)*6)}
.lbcell{display:flex;flex-direction:column;align-items:center;gap:calc(var(--lu)*7);padding:calc(var(--lu)*2) 0}
.lbcell .w{font-size:calc(var(--lu)*12);font-weight:700;color:var(--k-mut)}
.lbcell:first-child .w{color:var(--stamp)}
.lbcell .n{font-size:calc(var(--lu)*12.5);font-weight:600;color:var(--k-mut);font-variant-numeric:tabular-nums}
.lbcell .stamp{width:calc(var(--lu)*34);height:calc(var(--lu)*34);border-radius:50%;
  border:2.5px solid var(--stamp);color:var(--stamp);display:flex;align-items:center;justify-content:center;
  font-family:var(--font-disp);font-size:calc(var(--lu)*12.5);transform:rotate(-8deg);line-height:1}
.lbcell .blank{width:calc(var(--lu)*34);height:calc(var(--lu)*34);border-radius:50%;background:var(--k-bg)}
.lbcell.today .n{color:var(--brand);font-weight:800}
.lbcell.today .blank{background:#fff;border:2.5px solid var(--brand)}
.lbempty{font-size:calc(var(--lu)*13.5);color:var(--k-mut);line-height:1.6;padding:calc(var(--lu)*14) 0 0}
.lbstreak{display:flex;gap:calc(var(--lu)*24);border-top:1px solid var(--k-line);
  padding:calc(var(--lu)*13) 0 calc(var(--lu)*10)}
.lbstreak .lb{font-size:calc(var(--lu)*12.5);color:var(--k-mut);font-weight:600}
.lbstreak .vv{display:flex;align-items:baseline;gap:3px;margin-top:calc(var(--lu)*4)}
.lbstreak .vv b{font-size:calc(var(--lu)*22);font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.lbstreak .vv span{font-size:calc(var(--lu)*13);font-weight:700;color:var(--k-mut)}
.lbstreak .vv.none b{font-size:calc(var(--lu)*15);font-weight:700;color:var(--k-mut)}

/* 줄 목록 — 카드가 아니라 행 */
.lbrow{display:flex;align-items:center;gap:calc(var(--lu)*13);width:100%;text-align:left;color:var(--k-fg);
  background:none;padding:calc(var(--lu)*15) 0;border-bottom:1px solid var(--k-line);min-height:calc(var(--lu)*72)}
.lbsection .lbrow:last-of-type{border-bottom:0}
.lbrow .no{flex:none;width:calc(var(--lu)*30);height:calc(var(--lu)*30);border-radius:50%;
  background:var(--k-bg);color:var(--k-mut);display:flex;align-items:center;justify-content:center;
  font-size:calc(var(--lu)*13.5);font-weight:800}
.lbrow.done .no{background:var(--ok2);color:#fff}
.lbrow.done .no svg{width:calc(var(--lu)*15);height:calc(var(--lu)*15)}
.lbrow .tx{flex:1;min-width:0}
.lbrow .tx .md{font-size:calc(var(--lu)*12);font-weight:700;color:var(--k-mut)}
.lbrow .tx b{display:block;font-size:calc(var(--lu)*15);font-weight:700;line-height:1.5;margin-top:calc(var(--lu)*3)}
.lbrow.done .tx b{color:var(--k-mut)}
.lbrow .act{flex:none;background:var(--brand);color:#fff;border-radius:calc(var(--lu)*8);
  padding:calc(var(--lu)*13) calc(var(--lu)*17);font-size:calc(var(--lu)*14);font-weight:700;
  white-space:nowrap;min-height:calc(var(--lu)*48);display:flex;align-items:center}
.lbrow.done .act{background:none;color:var(--ok2);font-weight:700;padding-right:0}

.lbrow .dot{flex:none;width:calc(var(--lu)*42);height:calc(var(--lu)*42);border-radius:calc(var(--lu)*9);
  display:flex;align-items:center;justify-content:center;color:#fff;font-size:calc(var(--lu)*12.5);font-weight:800}
.lbrow .ct{flex:none;font-size:calc(var(--lu)*13.5);font-weight:700;color:var(--k-mut);
  font-variant-numeric:tabular-nums}
.lbrow .ct.full{color:var(--ok2)}
.lbrow .cv{flex:none;width:calc(var(--lu)*18);height:calc(var(--lu)*18);color:#AAB2BD}
.lbrow .cv svg{width:100%;height:100%}

.lbdone{background:#EEF6F1;color:var(--ok2);border-radius:calc(var(--lu)*10);
  padding:calc(var(--lu)*14);font-size:calc(var(--lu)*14);font-weight:700;line-height:1.6;
  margin:calc(var(--lu)*14) 0 calc(var(--lu)*4)}
.lbnote{font-size:calc(var(--lu)*12.5);color:var(--k-mut);line-height:1.7;
  padding:calc(var(--lu)*18) calc(var(--lu)*16) calc(var(--lu)*26)}

.scrollhint{position:sticky;bottom:calc(var(--lu)*12);align-self:center;display:inline-flex;align-items:center;
  gap:7px;background:rgba(26,29,35,.9);color:#fff;border-radius:999px;padding:10px 17px;
  font-size:13px;font-weight:700;margin-top:calc(var(--lu)*-46);pointer-events:none;z-index:4}
.scrollhint svg{width:14px;height:14px}

/* ===== 실제 키오스크 비율·구성 ===== */
.device{height:auto}
.device.kiosk{width:auto;max-width:calc(var(--kw,400) * 1px);margin:0 auto;border-radius:12px;height:auto}

/* 시작(광고) 화면 */
.attract{min-height:100%;display:flex;flex-direction:column;background:var(--k-card);color:var(--k-fg);text-align:center}
.attract .ad{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:10px;padding:22px 16px 16px;
  background:linear-gradient(180deg,#9FD3F5 0%,#CDE9FA 46%,#E6F3FC 100%)}
[data-mode="burger"] .attract .ad{background:linear-gradient(180deg,#FFE08A 0%,#FFF0C2 50%,#FFF8E2 100%)}
[data-mode="snack"] .attract .ad{background:linear-gradient(180deg,#F6C9B6 0%,#FBE2D6 52%,#FDF1EA 100%)}
.attract .logo-sm{width:34px;height:34px;color:var(--brand)}
.attract .logo-sm svg{width:100%;height:100%}
.attract .kicker{font-size:17px;font-weight:800;color:#2C3A2F;letter-spacing:-.03em}
.attract h1{font-family:var(--font-disp);font-size:clamp(28px,8.6vw,38px);line-height:1.1;margin:0;
  letter-spacing:-.03em;color:var(--brand)}
.attract .newline{display:flex;align-items:center;justify-content:center;gap:7px;margin-top:2px}
.attract .newline .nw{background:#1E8A4B;color:#fff;font-size:10.5px;font-weight:900;border-radius:999px;
  padding:3px 8px;letter-spacing:.04em}
.attract .newline b{font-size:15px;font-weight:800;letter-spacing:-.02em;color:#2C3A2F}
.attract .hero{display:flex;align-items:flex-end;justify-content:center;gap:4px;width:100%;margin-top:6px}
.attract .hero .big{width:52%;max-width:210px}
.attract .hero .sm{width:22%;max-width:92px}
.attract .hero svg{width:100%;height:auto;display:block}

.adnote{flex:none;background:var(--accent);color:var(--accent-on);text-align:left;
  padding:9px 14px;font-size:10.5px;line-height:1.65;font-weight:600}
[data-mode="cafe"] .adnote{background:#E8DFC8;color:#3B3426}
[data-mode="snack"] .adnote{background:#F3D9A0;color:#3A2F20}

.adbottom{flex:none;display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:14px 14px 8px;background:var(--k-card)}
.startbtn{border:1.5px solid var(--k-line);border-radius:6px;background:var(--k-card);color:var(--k-fg);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:18px 8px;min-height:86px}
.startbtn b{font-size:19px;font-weight:800;letter-spacing:-.02em}
.startbtn span{font-size:11.5px;color:var(--k-mut);font-weight:600}
.pointbox{background:var(--accent);color:var(--accent-on);border-radius:6px;padding:11px 8px 9px;
  display:flex;flex-direction:column;align-items:center;gap:4px;min-height:86px}
[data-mode="cafe"] .pointbox,[data-mode="snack"] .pointbox{background:#2F3A33;color:#fff}
.pointbox b{font-size:14.5px;font-weight:900;letter-spacing:-.02em}
.pointbox small{font-size:10.5px;opacity:.85;font-weight:600}
.pointbox .qr{width:46px;height:46px;background:#fff;border-radius:4px;padding:3px;margin-top:2px}
.pointbox .qr svg{width:100%;height:100%;display:block}
.adutil{flex:none;display:flex;gap:9px;padding:0 14px 10px;background:var(--k-card)}
.adutil button{flex:1;border:1px solid var(--k-line);border-radius:5px;background:var(--k-card);
  display:flex;align-items:center;justify-content:center;gap:6px;padding:9px 6px;
  font-size:11px;font-weight:700;color:var(--k-mut)}
.adutil button svg{width:15px;height:15px;flex:none}
.adlegal{flex:none;margin:0;padding:0 14px calc(12px + env(safe-area-inset-bottom,0px));
  font-size:8.5px;line-height:1.5;color:var(--k-mut);text-align:left;background:var(--k-card)}

/* 메뉴 — 좌측 아이콘 레일 */
.sidecat{flex:none;width:76px;background:var(--k-bg);border-right:1px solid var(--k-line)}
.sidecat button{width:100%;padding:12px 3px 11px;display:flex;flex-direction:column;align-items:center;gap:5px;
  font-size:11px;font-weight:700;color:var(--k-mut);border-bottom:1px solid var(--k-line);line-height:1.2;
  font-family:var(--font-k)}
.sidecat button .ri{width:23px;height:23px}
.sidecat button .ri svg{width:100%;height:100%}
.sidecat button[aria-pressed="true"]{background:var(--k-card);color:var(--brand);box-shadow:inset 4px 0 0 var(--brand)}
.sidecat .home{color:var(--k-fg)}

/* 메뉴 머리 + 서브탭 */
.mhead{display:flex;align-items:center;gap:9px;padding:12px 12px 4px;background:var(--k-card)}
.mhead .lg{flex:none;width:26px;height:26px;color:var(--brand)}
.mhead .lg svg{width:100%;height:100%}
.mhead h2{flex:1;min-width:0;margin:0;font-family:var(--font-disp);font-size:21px;letter-spacing:-.03em;
  text-align:center;color:var(--k-fg)}
[data-mode="burger"] .mhead h2{color:var(--brand)}
.subtabs{display:flex;gap:7px;justify-content:center;flex-wrap:wrap;padding:10px 12px;background:var(--k-card)}
.subtabs button{border:1px solid var(--k-line);border-radius:999px;background:var(--k-card);
  padding:7px 16px;font-size:12.5px;font-weight:700;color:var(--k-mut)}
.subtabs button[aria-pressed="true"]{background:var(--k-fg);border-color:var(--k-fg);color:var(--k-card)}

/* 타일 — 3열, 뱃지, 가격+칼로리 */
[data-mode="burger"] .grid.two{grid-template-columns:repeat(3,1fr);gap:7px;padding:9px 8px}
[data-mode="burger"] .tile{min-height:0;padding:7px 4px 9px;gap:5px;border-radius:7px}
[data-mode="burger"] .tile .art{max-width:none;width:100%}
[data-mode="burger"] .tile .nm{font-family:var(--font-k);font-size:11px;font-weight:700;letter-spacing:-.02em;line-height:1.3}
[data-mode="burger"] .tile .pr{background:none;color:var(--k-fg);padding:0;font-size:10.5px;font-weight:800;
  font-variant-numeric:tabular-nums;letter-spacing:-.01em}
[data-mode="burger"] .tile .pr em{font-style:normal;color:var(--k-mut);font-weight:600;margin-left:4px}
[data-mode="burger"] .tile .flag{position:static;align-self:flex-start;margin-left:2px;font-size:8.5px;
  padding:2px 5px;border-radius:3px;background:var(--k-bg);color:var(--k-mut);font-weight:800}
[data-mode="burger"] .tile .flag.hot{background:var(--brand);color:#fff}

/* 하단 바 — 장바구니 + 주문내역 + 적립 QR */
.cartbar{position:sticky;bottom:0;z-index:6;background:var(--k-card);border-top:1px solid var(--k-line);
  padding:9px 10px 0;display:flex;align-items:center;gap:9px}
.cartbar .cartico{flex:none;display:flex;align-items:center;gap:5px;color:var(--k-fg)}
.cartbar .cartico .ci{width:26px;height:26px;color:var(--brand)}
.cartbar .cartico .ci svg{width:100%;height:100%}
.cartbar .cartico b{font-size:14px;font-weight:900;font-variant-numeric:tabular-nums}
.cartbar .go{flex:1;background:var(--brand);color:var(--brand-on);padding:13px 10px;border-radius:6px;
  font-size:14px;font-weight:900;text-align:center}
.cartbar .go[disabled]{background:var(--k-bg);color:#AEB4BC}
.cartbar .pt{flex:none;width:54px;align-self:stretch;max-height:62px;background:var(--accent);color:var(--accent-on);border-radius:5px;
  padding:5px 4px;text-align:center;font-size:8px;font-weight:800;line-height:1.3}
[data-mode="cafe"] .cartbar .pt,[data-mode="snack"] .cartbar .pt{background:#2F3A33;color:#fff}
.cartbar .pt .qr{width:100%;aspect-ratio:1/1;background:#fff;border-radius:3px;padding:2px;margin-top:2px}
.cartbar .pt .qr svg{width:100%;height:100%;display:block}
.kutil{flex:none;display:flex;gap:8px;background:var(--k-card);padding:8px 10px calc(9px + env(safe-area-inset-bottom,0px))}
.kutil button{flex:1;border:1px solid var(--k-line);border-radius:5px;background:var(--k-card);
  display:flex;align-items:center;justify-content:center;gap:5px;padding:8px 4px;
  font-size:11px;font-weight:700;color:var(--k-mut)}
.kutil button svg{width:14px;height:14px;flex:none}

/* ===== 테이블 오더 (가로형 태블릿) ===== */
[data-mode="table"]{
  --brand:#1F6F4A; --brand-on:#FFFFFF; --accent:#D9A441; --accent-on:#1A1A1A;
  --k-bg:#F2F3F5; --k-card:#FFFFFF; --k-line:#DFE3E8; --k-fg:#14181D; --k-mut:#626C78;
  --font-k:'Noto Sans KR',sans-serif;
  --font-disp:'Do Hyeon','Noto Sans KR',sans-serif;
}
[data-mode="table"] .app{max-width:900px}
.device.tablet{border-radius:16px;width:auto;max-width:none}
@media (min-width:720px){ .device.tablet{height:auto;aspect-ratio:16/10;align-self:center} }

.tbwrap{min-height:100%;display:flex;flex-direction:column;background:var(--k-bg);color:var(--k-fg);font-family:var(--font-k)}
.tbhead{flex:none;display:flex;align-items:center;gap:10px;background:var(--brand);color:#fff;padding:10px 14px}
.tbhead .tno{flex:none;background:#fff;color:var(--brand);border-radius:6px;padding:6px 11px;
  font-family:var(--font-disp);font-size:15px;letter-spacing:-.01em}
.tbhead .st{flex:1;min-width:0;font-family:var(--font-disp);font-size:17px;letter-spacing:-.01em}
.tbhead button{flex:none;display:inline-flex;align-items:center;gap:6px;border:1.5px solid rgba(255,255,255,.75);
  border-radius:7px;color:#fff;padding:8px 12px;font-size:13px;font-weight:800;white-space:nowrap}
.tbhead button.bell{background:var(--accent);border-color:var(--accent);color:var(--accent-on)}
.tbhead button svg{width:16px;height:16px}

.tbtabs{flex:none;display:flex;gap:0;overflow-x:auto;background:var(--k-card);border-bottom:1px solid var(--k-line)}

/* 시간제한 단추도 paintControls에서 이 줄 안으로 옮겨 붙입니다 — 모든 칸이 같은 넓이 */
.ctlrow{display:flex;gap:6px;flex:1 1 0;min-width:0}
.ctl{flex:1 1 0;min-width:0;flex-direction:column;gap:4px;min-height:60px;padding:7px 3px;
  font-size:13px;font-weight:700;line-height:1.2;text-align:center;
  white-space:normal;word-break:keep-all;overflow:hidden;
  transition:transform .08s,background .12s}
.ctl[hidden]{display:none}
.ctl svg{width:22px;height:22px;flex:none}
.ctl.wide{flex:1 1 0}
.ctl.on{background:#1B2638;border-color:#4F7CC4;color:#fff}

/* ===== 누름 반응 · 안내 말풍선 ===== */
.tapfx{position:absolute;width:56px;height:56px;margin:-28px 0 0 -28px;border-radius:50%;
  pointer-events:none;z-index:80;background:rgba(57,96,159,.32);animation:tapfx .42s ease-out forwards}

function demoMileageKey(){ return "digital-practice-demo-mileage-v1:"+USERS.cur; }
function demoMileage(){
  if(!demoInstitution()) return {entries:[],points:0};
  try{
    var data=JSON.parse(localStorage.getItem(demoMileageKey())||"null");
    if(data && Array.isArray(data.entries)){
      var entries=data.entries.filter(function(x){
        return x && typeof x.date==="string" && (
          (x.kind==="daily" && x.points===50) ||
          (x.kind==="streak" && x.points===100) ||
          (!x.kind && x.mode && Number.isInteger(x.mi) && x.points===10));
      });
      return {entries:entries,points:entries.reduce(function(sum,x){return sum+x.points;},0)};
    }
  }catch(e){}
  return {entries:[],points:0};
}
function rewardMonth(date){ return date.split("-").slice(0,2).join("-"); }
function monthlyStreakClaimed(){
  var month=rewardMonth(todayStr());
  return demoMileage().entries.some(function(x){return x.kind==="streak" && rewardMonth(x.date)===month;});
}
function earnDemoMileage(streak,mode,mi){
  if(!demoInstitution()) return 0;
  var date=todayStr(), data=demoMileage();
  var earned=0;
  if(!data.entries.some(function(x){return x.kind==="daily" && x.date===date;})){
    data.entries.unshift({kind:"daily",date:date,mode:mode,mi:mi,points:50}); earned+=50;
  }
  if(streak>=7 && !data.entries.some(function(x){return x.kind==="streak" && rewardMonth(x.date)===rewardMonth(date);})){
    data.entries.unshift({kind:"streak",date:date,points:100}); earned+=100;
  }
  if(!earned) return 0;
  try{ localStorage.setItem(demoMileageKey(),JSON.stringify({entries:data.entries})); }catch(e){return 0;}
  return earned;
}

function h32(s){var h=0;for(var i=0;i<s.length;i++){h=(h*31+s.charCodeAt(i))|0;}return Math.abs(h)||7;}

function mkey(mode,mi){ return mode+":"+mi; }
function recordClear(mode,mi){
  logClear(mode,mi);
  DAILY.total=(DAILY.total||0)+1;
  var k=mkey(mode,mi);
  justCleared = DAILY.cleared.indexOf(k)<0;
  if(justCleared) DAILY.cleared.push(k);
  var earned=0;
  if(!DAILY.allClear) DAILY.allClear=[];
  if(DAILY.allClear.indexOf(k)<0) DAILY.allClear.push(k);
  if(!DAILY.attended){            /* 하루 한 가지만 해도 출석 */
    DAILY.attended=true;
    DAILY.streak = (DAILY.lastDone===yesterdayStr()) ? (DAILY.streak||0)+1 : 1;
    DAILY.lastDone=DAILY.date;
    DAILY.best=Math.max(DAILY.best||0,DAILY.streak);
    if(!DAILY.hist) DAILY.hist=[];
    if(DAILY.hist.indexOf(DAILY.date)<0) DAILY.hist.push(DAILY.date);
    if(DAILY.hist.length>80) DAILY.hist=DAILY.hist.slice(-80);
  }
  if(DAILY.cleared.length>=3) DAILY.dayDone=true;
  if(justCleared) earned=earnDemoMileage(DAILY.streak,mode,mi);
  saveDaily(); paintDaily();
  if(S.mode==="bank"||S.mode==="train"||S.mode==="table"||S.mode==="taxi"){
    toast("미션 성공!"+(LASTRES?" 걸린 시간 "+secTxt(LASTRES.s)+" · 헤맨 횟수 "+LASTRES.w+"번":"")+(justCleared?" · 오늘 "+Math.min(DAILY.cleared.length,3)+"/3":"")+(earned?" · 마일리지 +"+earned+"P":""),true);
  }else if(earned) toast("미션 성공! 마일리지 +"+earned+"P",true);
}
/* 추천 미션: 오늘의 세 가지 중 아직 안 한 것 → 없으면 아무 미션이나 */
function nextDailyTask(){
  var i;
  for(i=0;i<DAILY.plan.length;i++){
    var p=DAILY.plan[i];
    if(p && MISSIONS[p.mode] && DAILY.cleared.indexOf(mkey(p.mode,p.mi))<0) return p;
  }
  var all=[];
  Object.keys(MISSIONS).forEach(function(m){ MISSIONS[m].forEach(function(_,j){ all.push({mode:m,mi:j}); }); });
  for(i=0;i<all.length;i++){
    if(DAILY.cleared.indexOf(mkey(all[i].mode,all[i].mi))<0) return all[i];
  }
  return null;
}
function paintDaily(){
  var d=document.getElementById("daily"), n=Math.min(DAILY.cleared.length,3), all=DAILY.cleared.length>=3;
  d.className="daily"+(all?" allclear":"");
  var nx=nextDailyTask();
  d.innerHTML='<span class="streak"><span class="fire"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2c2.6 3.8 5.6 5.4 5.6 9.2A5.6 5.6 0 0 1 6.4 11.2C6.4 8.6 8.2 7 9 4.8c.9 1.6 1.9 2 3-2.8z"/></svg></span>'+(DAILY.streak||0)+'일</span>'
    +'<span class="pips">'+[0,1,2].map(function(i){return '<i class="'+(i<n?"on":"")+'"></i>';}).join("")+'</span>'
    +'<span class="dtx">'+(all
        ? '<b>오늘 연습 끝!</b> 내일도 오시면 연속 '+((DAILY.streak||0)+1)+'일이 됩니다.'
        : '오늘의 연습 <b>'+n+'/3</b>'+(nx?' · 다음 추천은 '+MODE_LABEL[nx.mode]+' 미션':''))
    +'</span>'
    +(all||!nx?'':'<button class="dgo" data-d="go">받기</button>');
}

function paintTimer(){ el.tfill.style.width=(S.left/60*100)+"%"; }
function startTick(){
  if(tick) clearInterval(tick);
  tick=setInterval(function(){
    idleTick();
    /* 기차 예매 — 결제 제한시간 (화면 전체를 다시 그리지 않고 숫자만 바꿉니다) */
    if(S.mode==="train" && S.tr && S.tr.hold>0 && !S.tr.paid
       && (S.tr.step==="holdpay"||S.tr.step==="pay"||S.tr.step==="pin")){
      S.tr.hold--;
      var c=document.getElementById("holdclk");
      if(c) c.textContent=clock(S.tr.hold);
      if(S.tr.hold<=0){ S.tr.expired=true; S.tr.step="holdpay"; render(); }
      return;
    }
    if(!timerVisible() || S.timedout) return;
    S.left--; paintTimer();
    if(S.left<=0){ S.timedout=true; render(); }
  },1000);
}

      : S.lv==="help"?"막혔을 때 할 일과 낯선 말 풀이입니다."
      : S.lv==="user"?"기관 로그인과 기기 안에서 이름을 고르는 기능이 있습니다. 손님도 연습할 수 있습니다."
      : S.lv==="mileage"?"마일리지와 혜택 예시를 확인할 수 있습니다."
      : "로비에서 오늘 할 연습을 고르세요. 아래 ‘가게 고르기’로 바로 열 수도 있습니다.";
    var tg0=document.querySelector(".mission .tag"); tg0.textContent="안내"; tg0.className="tag";
    el.swap.hidden=true; paintDaily(); if(S.lv==="home") lobbyScrollHint(); else el.screen.onscroll=null;
    paintNowStore(); paintControls(); paintMission(); if(S.lv==="map") mountMap(); return;
  }

  else if(S.mode==="train"){ if(!S.tr) S.tr=freshTrain(S.big); h=vTrain(); }

  else if(S.screen==="setdrink") h=vChoose("drink");
  else if(S.screen==="cart") h=vCart();
  else if(S.screen==="pay") h=vPay();
  else if(S.screen==="card") h=vCard();

  if(S.modal) h+=vModal();
  if(S.timedout && S.mode!=="bank") h+='<div class="tover"><b>화면이 초기화됩니다</b><p>일정 시간 동안 조작이 없어<br>처음 화면으로 돌아갑니다.</p><button data-a="restart">처음부터 다시</button></div>';

  el.screen.innerHTML=h;

  var tg=document.querySelector(".mission .tag"), lv=lvOf(S.mode,S.mission);

  if(S.mode==="taxi"){
    mountTaxiMap();

  }
  if((S.hints||AUTO) && HINT && !S.timedout){
    var t=el.screen.querySelector(HINT);
    if(t) t.classList.add("hintpulse");
  }
  if(S.screen==="card" && S.inserting && S.mode!=="bank"){
    setTimeout(function(){
      S.inserting=false; S.orderNo=100+Math.floor(Math.random()*800);
      S.screen="done"; if(!finishCheck()) logFail(); render();
    },1700);
  }
}

}
